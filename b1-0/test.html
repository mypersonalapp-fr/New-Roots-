<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Test final grammaire B1.0</title>
<style>
:root{--night:#0d1226;--gold:#ffd36b;--txt:#f4efe2;--ok:#7fd8a0;--no:#ff9a8a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0d1226;color:var(--txt);font:16px/1.45 "Manrope","Avenir Next","Segoe UI",system-ui,sans-serif}
.bg{position:fixed;inset:0;background:#0d1226 url(../assets/img/b/lieu-gram.jpg) center/cover;filter:brightness(.4)}
@media (min-aspect-ratio:6/5){.bg{background-image:url(../assets/img/b/lieu-gram-land.jpg)}}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between}
.top b{color:var(--gold)}.top button{background:none;border:1px solid #fff4;color:var(--txt);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
.bar{height:6px;border-radius:9px;background:#fff2;margin:10px 0}.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--gold);transition:width .3s}
.card{flex:1;overflow:auto;background:#0d1226cc;border:1px solid #ffd36b55;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(4px)}
.blk{color:var(--gold);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.q{font-size:19px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px}
.opts button,.go{background:#ffffff14;border:1px solid #ffd36b66;color:var(--txt);border-radius:12px;padding:13px 14px;font:inherit;text-align:left;cursor:pointer}
.opts button:hover,.go:hover{background:#ffd36b33}
.go{background:var(--gold);color:#2a1a06;font-weight:700;text-align:center}
input[type=text]{width:100%;background:#fff1;border:1px solid #ffd36b88;border-radius:12px;color:var(--txt);padding:13px;font:inherit}
.row{display:flex;gap:8px}.row input{flex:1}
.ghost{background:none;border:0;color:#fffa;text-decoration:underline;cursor:pointer;font:inherit;padding:6px}
.res b.big{font-size:34px;color:var(--gold)}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid #fff2}
.ok{color:var(--ok)}.no{color:var(--no)}.pe{color:var(--gold)}
small{color:#fffb}
</style></head><body><div class="bg"></div>
<div class="app"><div class="top"><span><b>Test final</b> · Grammaire G1–G6</span><button id="quit">Quitter</button></div><div class="bar"><i id="pb"></i></div><div class="card" id="card"></div></div>
<script>
const Q=[{"b": 0, "q": "Complète : “I ___ with your suggestion.”", "t": "mc", "o": ["am agree", "agree", "agreeing"], "k": 1}, {"b": 0, "q": "Choisis la phrase correcte.", "t": "mc", "o": ["Can you explain me the rule?", "Can you explain the rule to me?", "Can you explain me the rule?"], "k": 1}, {"b": 0, "q": "Complète : “We discussed ___ the final after the match.”", "t": "mc", "o": ["about", "on", "(aucune préposition)"], "k": 2}, {"b": 0, "q": "Complète : “Please listen ___ the coach carefully.”", "t": "mc", "o": ["to", "at", "(aucune préposition)"], "k": 0}, {"b": 0, "q": "Corrige la phrase : “She is agree with the referee.”", "t": "tx", "ok": ["she agrees with the referee"], "re": [], "show": "She agrees with the referee.", "pend": false, "ph": null, "raw": null}, {"b": 0, "q": "Écris une demande polie pour demander à un collègue de t’expliquer le programme.", "t": "tx", "ok": ["could you explain the programme to me please"], "re": ["^(could|can|would) you (please )?explain (the |this |that )?(programme|program|schedule|plan)( for the (week|day|event))? to me( please)?$"], "show": "Could you explain the programme to me, please?", "pend": true, "ph": null, "raw": null}, {"b": 1, "q": "Complète : “Maya usually ___ (train) on Tuesdays, but this week she ___ (rest).” (deux formes)", "t": "tx", "ok": ["trains is resting"], "re": ["trains.*(is resting|'s resting|s resting)"], "show": "trains / is resting", "pend": false, "ph": null, "raw": null}, {"b": 1, "q": "Choisis la forme qui exprime une tendance en cours : “The city ___ more crowded.”", "t": "mc", "o": ["becomes", "is becoming", "become"], "k": 1}, {"b": 1, "q": "Complète : “I ___ (not / understand) this instruction.”", "t": "tx", "ok": ["do not understand"], "re": [], "show": "don’t understand", "pend": false, "ph": null, "raw": null}, {"b": 1, "q": "Complète : “The chef ___ (taste) the sauce now; it ___ (taste) too salty.” (deux formes)", "t": "tx", "ok": ["is tasting tastes"], "re": ["(is tasting|'s tasting|s tasting).*tastes"], "show": "is tasting / tastes", "pend": false, "ph": null, "raw": null}, {"b": 1, "q": "Choisis le sens de “I’m having lunch with the team at one.”", "t": "mc", "o": ["Je possède le déjeuner.", "J’ai un repas / rendez-vous prévu.", "Je mange toujours à une heure."], "k": 1}, {"b": 1, "q": "Corrige la phrase pour décrire un comportement agaçant répété : “You interrupt me every time!”", "t": "tx", "ok": ["you are always interrupting me"], "re": ["^you('re| are) (always|constantly|forever) interrupting me$"], "show": "You are always interrupting me.", "pend": false, "ph": null, "raw": null}, {"b": 2, "q": "Complète : “If our team ___ (win), we ___ (reach) the final.” (deux formes)", "t": "tx", "ok": ["wins will reach"], "re": ["wins.*(will reach|'ll reach|ll reach)"], "show": "wins / will reach", "pend": false, "ph": null, "raw": null}, {"b": 2, "q": "Choisis la phrase correcte.", "t": "mc", "o": ["If it will rain, we will stay inside.", "If it rains, we will stay inside.", "If it rain, we stay inside yesterday."], "k": 1}, {"b": 2, "q": "Mets les mots en ordre : “you / if / hurry / will / catch / the bus / you”.", "t": "tx", "ok": [], "re": [], "show": "If you hurry, you will catch the bus.", "pend": false, "ph": null, "raw": "^if you hurry, you will catch the bus\\.?$"}, {"b": 2, "q": "Complète la question : “What ___ you do if the match ___ (be) cancelled?” (deux formes)", "t": "tx", "ok": ["will is"], "re": [], "show": "will / is", "pend": false, "ph": null, "raw": null}, {"b": 2, "q": "Complète avec la forme négative : “If Leo ___ (not / practise), he ___ (not / improve).”", "t": "tx", "ok": ["does not practise will not improve"], "re": ["does not (practise|practice).*will not improve"], "show": "doesn’t practise / won’t improve", "pend": false, "ph": null, "raw": null}, {"b": 2, "q": "Écris une phrase First Conditional sur une possibilité pendant un match.", "t": "tx", "ok": [], "re": ["^if .+ (will|can|may|might|must) .+"], "show": "Exemple : If we score again, we will win the match.", "pend": true, "ph": null, "raw": null}, {"b": 3, "q": "Complète : “The film ___ (come out) in 2022.”", "t": "tx", "ok": ["came out"], "re": [], "show": "came out", "pend": false, "ph": null, "raw": null}, {"b": 3, "q": "Complète : “I ___ never ___ (see) that series.” (deux formes)", "t": "tx", "ok": ["have never seen"], "re": ["^(have|ve) never seen$|^never seen$"], "show": "have never seen", "pend": false, "ph": null, "raw": null}, {"b": 3, "q": "Choisis la phrase correcte.", "t": "mc", "o": ["Did you watched the final yesterday?", "Did you watch the final yesterday?", "Have you watch the final yesterday?"], "k": 1}, {"b": 3, "q": "Complète avec just : “The episode ___ ___ (finish); the credits are on now.”", "t": "tx", "ok": ["has just finished"], "re": ["^(has|s) just finished$"], "show": "has just finished", "pend": false, "ph": null, "raw": null}, {"b": 3, "q": "Complète : “She ___ (live) here since 2021.”", "t": "tx", "ok": ["has lived", "has been living"], "re": ["^(has|s) (lived|been living)$"], "show": "has lived", "pend": false, "ph": null, "raw": null}, {"b": 3, "q": "Écris une phrase pour dire que tu as déjà vu un film, sans préciser quand.", "t": "tx", "ok": [], "re": ["^(i )?(have|ve) (already )?(seen|watched) .+"], "show": "Exemple : I have already seen that film.", "pend": true, "ph": null, "raw": null}, {"b": 4, "q": "Une décision est prise au moment de parler : “The net is broken.” “I ___ get a new one.”", "t": "mc", "o": ["will", "am going to", "am getting"], "k": 0}, {"b": 4, "q": "On voit de gros nuages noirs. Complète : “It ___ rain.”", "t": "mc", "o": ["will", "is going to", "rains"], "k": 1}, {"b": 4, "q": "Un rendez-vous avec le coach est fixé pour demain à 10 h : “We ___ the coach at 10 tomorrow.”", "t": "mc", "o": ["meet", "are meeting", "will meet"], "k": 1}, {"b": 4, "q": "Complète l’horaire officiel : “The final ___ at 6 p.m.”", "t": "mc", "o": ["starts", "is starting", "will start"], "k": 0}, {"b": 4, "q": "Réécris comme une intention déjà formée : “I plan to join the tennis club.”", "t": "tx", "ok": ["i am going to join the tennis club"], "re": [], "show": "I am going to join the tennis club.", "pend": false, "ph": null, "raw": null}, {"b": 4, "q": "Écris une phrase avec will pour faire une prédiction ou une promesse liée au sport.", "t": "tx", "ok": [], "re": ["\\bwill (not )?[a-z]+"], "show": "Exemple : I think our team will win.", "pend": true, "ph": null, "raw": null}, {"b": 5, "q": "Complète : “At 7 p.m., the players ___ (warm up).”", "t": "tx", "ok": ["were warming up"], "re": [], "show": "were warming up", "pend": false, "ph": null, "raw": null}, {"b": 5, "q": "Complète : “We ___ (watch) the game when the lights ___ (go out).” (deux formes)", "t": "tx", "ok": ["were watching went out"], "re": ["were watching.*went out"], "show": "were watching / went out", "pend": false, "ph": null, "raw": null}, {"b": 5, "q": "Choisis la phrase correcte.", "t": "mc", "o": ["While I was running, I slipped.", "While I ran, I was slipping suddenly.", "While I am running, I slipped yesterday."], "k": 0}, {"b": 5, "q": "Complète : “___ the coach was speaking, the crowd was getting louder.”", "t": "mc", "o": ["While", "Because", "Unless"], "k": 0}, {"b": 5, "q": "Complète : “I ___ (use to) play rugby, but I don’t anymore.”", "t": "tx", "ok": ["used to"], "re": [], "show": "used to", "pend": false, "ph": null, "raw": null}, {"b": 5, "q": "Mets à la forme interrogative : “They used to train every morning.”", "t": "tx", "ok": ["did they use to train every morning"], "re": [], "show": "Did they use to train every morning?", "pend": false, "ph": null, "raw": null}];const BL=["G1 · Verbes et prépositions", "G2 · Present Simple et Present Continuous", "G3 · First Conditional", "G4 · Past Simple et Present Perfect", "G5 · Parler du futur", "G6 · Récit au passé"];
const KEY='test-final-v1';let st={i:0,a:[]};try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.a))st=x}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nz(s){let t=String(s==null?'':s).toLowerCase().replace(/[’‘´`]/g,"'").replace(/[“”"]/g,'');
 t=t.replace(/\bcan't\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\b(do|does|is|are|am|did|was|were|has|have)n't\b/g,'$1 not').replace(/n't\b/g,' not').replace(/\bi'm\b/g,'i am').replace(/\b(you|we|they)'re\b/g,'$1 are').replace(/\b(he|she|it|that|there|what|who)'s\b/g,'$1 is');
 return t.replace(/[.!?,;:\/]/g,' ').replace(/\s+/g,' ').trim()}
function judge(q,v){ // renvoie 'ok' | 'ko' | 'pend'
 if(q.t==='mc')return v===q.k?'ok':'ko';
 const raw=String(v||'').trim().toLowerCase().replace(/[’‘´`]/g,"'");
 if(q.raw&&new RegExp(q.raw,'i').test(raw))return 'ok';
 const n=nz(v);if(!n)return q.pend?'pend':'ko';
 const ex=q.ok.map(nz);const nn=n.replace(/^(i|you|he|she|it|we|they) /,'');
 if(ex.includes(n)||ex.includes(nn)||ex.some(e=>e.replace(/^(i|you|he|she|it|we|they) /,'')===nn))return 'ok';
 if(q.re.some(r=>new RegExp(r,'i').test(n)||new RegExp(r,'i').test(raw)))return 'ok';
 return q.pend?'pend':'ko'}
const card=document.getElementById('card'),pb=document.getElementById('pb');
document.getElementById('quit').onclick=()=>{try{parent.postMessage({roots:'exit'},'*')}catch(e){}};
function intro(){card.innerHTML=`<div class="blk">Bilan cumulatif G1 à G6</div><div class="q">36 questions · 1 point chacune</div><small>Réponds sans consulter tes notes. Note sur 15 = points × 15 ÷ 36. Seuil indicatif : 12,5/15, soit 30/36 (50 à 60 minutes). Les corrections sont données à la fin, pas pendant le test.</small>${st.a.length?`<button class="go" id="resume">Reprendre à la question ${Math.min(st.i,35)+1}</button><button class="ghost" id="again">Recommencer à zéro</button>`:`<button class="go" id="start">Commencer</button>`}`;
 const s=document.getElementById('start'),r=document.getElementById('resume'),a=document.getElementById('again');
 if(s)s.onclick=show;if(r)r.onclick=()=>st.i>=36?result():show();
 if(a)a.onclick=()=>{st={i:0,a:[]};save();intro()}}
function show(){if(st.i>=36)return result();const q=Q[st.i];pb.style.width=(st.i/36*100)+'%';
 card.innerHTML=`<div class="blk">${esc(BL[q.b])} · Question ${st.i+1} / 36</div><div class="q">${esc(q.q)}</div>`+(q.t==='mc'?`<div class="opts">${q.o.map((o,k)=>`<button data-k="${k}">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join('')}</div>`:`<div class="row"><input type="text" id="in" autocomplete="off" autocapitalize="off" placeholder="Écris ta réponse en anglais…"><button class="go" id="ok">OK</button></div>`)+`<button class="ghost" id="skip">Passer cette question</button>`;
 const next=v=>{st.a[st.i]={v,j:judge(q,v)};st.i++;save();show()};
 card.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>next(+b.dataset.k));
 const inp=document.getElementById('in');if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())next(inp.value)};document.getElementById('ok').onclick=()=>{if(inp.value.trim())next(inp.value)}}
 document.getElementById('skip').onclick=()=>{st.a[st.i]={v:null,j:'ko'};st.i++;save();show()}}
function result(){pb.style.width='100%';
 const per=BL.map((n,b)=>{let ok=0,pe=0,t=0;Q.forEach((q,i)=>{if(q.b!==b)return;t++;const j=st.a[i]&&st.a[i].j;if(j==='ok')ok++;else if(j==='pend')pe++});return{n,ok,pe,t}});
 const ok=per.reduce((s,p)=>s+p.ok,0),pe=per.reduce((s,p)=>s+p.pe,0);
 const f=x=>(Math.round(x*10)/10).toString().replace('.',',');
 const lo=f(ok*15/36),hi=f((ok+pe)*15/36);
 const verdict=(ok>=30)?'Seuil atteint':((ok+pe)>=30?'Seuil atteignable : dépend des productions libres à relire':ok>=24?'Révisions ciblées conseillées':'Reprendre les cours concernés');
 const weak=per.filter(p=>p.t-p.ok-p.pe>0||p.pe>0).sort((a,b)=>(a.ok/a.t)-(b.ok/b.t)).slice(0,2);
 card.innerHTML=`<div class="res"><div class="blk">Ton bilan</div><b class="big">${ok} / 36</b><div>${pe?`+ ${pe} production${pe>1?'s':''} libre${pe>1?'s':''} à relire (correction intelligente)<br>`:''}Équivalent : <b>${lo}${pe?' à '+hi:''} / 15</b> · seuil 12,5/15 (30/36)</div><div><b>${verdict}</b></div></div>
 <table>${per.map(p=>`<tr><td>${esc(p.n)}</td><td class="${p.ok===p.t?'ok':p.ok+p.pe===p.t?'pe':'no'}">${p.ok}/${p.t}${p.pe?` (+${p.pe} à relire)`:''}</td></tr>`).join('')}</table>
 ${ok<30&&weak.length?`<small>Pour cibler la reprise : revois d’abord ${weak.map(p=>esc(p.n.split(' · ')[0])).join(' puis ')}, puis refais les questions correspondantes sans regarder.</small>`:''}
 <div class="opts">${Q.map((q,i)=>({q,i,a:st.a[i]})).filter(x=>!x.a||x.a.j!=='ok').map(x=>`<div><small>Q${x.i+1} — ${x.a&&x.a.j==='pend'?'à relire':'réponse attendue'} : <b>${esc(x.q.t==='mc'?x.q.o[x.q.k]:x.q.show)}</b></small></div>`).join('')}</div>
 <button class="go" id="redo">Refaire le test</button>`;
 document.getElementById('redo').onclick=()=>{st={i:0,a:[]};save();intro()};
 try{st.done=true;st.score=ok;st.pend=pe;save()}catch(e){}}
intro();
</script></body></html>
