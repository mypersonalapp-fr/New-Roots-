<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Roots · A1.1 · Bilan des compétences</title><style>
*{box-sizing:border-box}body{margin:0;background:#79c9eb;font-family:system-ui,-apple-system,sans-serif;color:#25343d}main{max-width:450px;min-height:100dvh;margin:auto;padding:20px 16px 70px;background:linear-gradient(#7fd2f8,#e3f7f9 60%,#a3cf86);position:relative}main:before{content:"🌴";position:absolute;right:0;top:55px;font-size:85px;opacity:.45;pointer-events:none}.panel{position:relative;background:#ffffffeb;border:1px solid #fff;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 5px 25px #316b7c24}h1{font-size:24px}h2{font-size:19px}p{line-height:1.55}.muted{color:#5b6a75;font-size:13px}.pill{display:inline-block;background:#fff1d3;color:#9b6115;border-radius:22px;padding:7px 12px;font-size:13px;font-weight:700}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}button.primary{background:#e99836;color:#fff;width:100%;margin:7px 0}button.choice{display:block;background:#f3f9fd;border:1px solid #d7e5ed;width:100%;text-align:left;margin:8px 0}button.choice.sel{border:2px solid #e99836;background:#fff1da}textarea{width:100%;min-height:125px;border-radius:12px;border:1px solid #cbdce7;padding:12px;font:inherit}input[type=number]{width:85px;padding:10px;border-radius:10px;border:1px solid #bdd2dc}label{display:block;margin:12px 0}.bar{height:9px;border-radius:9px;background:#e0e9ef;overflow:hidden}.bar>div{height:100%;background:#e99836}a{color:#2b647d}.line{border-bottom:1px solid #e0e9ee;padding:12px 0}.score{font-size:44px;text-align:center;font-weight:800;color:#ce7d19}</style></head><body><main id="app"></main><script>
const texts=[
{title:'Emma à Paris',text:'Hello! My name is Emma. I am ten years old. I am French. I live in Paris. I am a student.',q:[['Where does Emma live?',['London','Paris','Madrid'],1],['How old is Emma?',['10','12','20'],0],['Is Emma a student?',['Yes','No','Not stated'],0]]},
{title:'Lucas à Porto',text:'Hi! I am Lucas. I am twenty-five. I am Portuguese and I live in Porto. I am a teacher.',q:[['Where does Lucas live?',['Porto','Lisbon','Rome'],0],['How old is Lucas?',['15','25','35'],1],['What is his job?',['Doctor','Teacher','Student'],1]]},
{title:'Maya à Manchester',text:'Good morning! My name is Maya Smith. I am British. I live in Manchester. I have a sister called Lily.',q:[['What is her last name?',['Lily','Maya','Smith'],2],['Where does she live?',['Manchester','Paris','London'],0],['Who is Lily?',['Her sister','Her mother','Her friend'],0]]}
];
const audios=[
{script:'Hello! I am Sam. I am twenty. I am British. I live in London.',q:[['How old is Sam?',['10','20','30'],1],['Where does Sam live?',['Paris','London','Rome'],1],['Is Sam British?',['Yes','No','Unknown'],0]]},
{script:'Hi! My name is Anna. I am from Spain. I live in Madrid. I am a student.',q:[['Where is Anna from?',['Spain','France','Italy'],0],['Where does Anna live?',['London','Madrid','Porto'],1],['Is Anna a student?',['Yes','No','Unknown'],0]]},
{script:'Good morning. I am David. I am thirty years old. I am Canadian. I live in Toronto.',q:[['How old is David?',['13','30','40'],1],['What nationality is David?',['British','Canadian','French'],1],['Where does he live?',['Toronto','Paris','Madrid'],0]]}
];
const grammar=[
['I ___ French.',['am','is','are'],0],['She ___ 12.',['am','is','are'],1],['We ___ students.',['is','are','am'],1],['I ___ not British.',['am','is','are'],0],['___ he live in Paris?',['Do','Does','Is'],1],['I ___ a sister.',['has','have','am'],1],['She ___ blue eyes.',['have','has','is'],1],['This is ___ bag.',['my','me','I'],0],['___ is your name?',['Where','What','When'],1],['___ are my shoes.',['These','This','That'],0],['They ___ not from Spain.',['are','is','am'],0],['Where ___ you live?',['does','do','is'],1],['He ___ not a teacher.',['are','is','do'],1],['My ___ name is Smith.',['last','old','from'],0],['___ she have a brother?',['Does','Do','Is'],0]
];
const KEY='roots_a11_competency_v1';let state={version:1,seed:0,reading:0,listening:0,grammar:[],answers:{},writing:'',spoken:'',oralDone:false,manualWriting:null,manualSpeaking:null,history:[],submitted:false,transcript:false};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;'}[c]));
const app=document.getElementById('app');
function start(){state.seed++;state.reading=state.seed%texts.length;state.listening=(state.seed+1)%audios.length;state.grammar=Array.from({length:10},(_,i)=>(state.seed*5+i*7)%grammar.length);state.answers={};state.writing='';state.spoken='';state.oralDone=false;state.manualWriting=null;state.manualSpeaking=null;state.submitted=false;state.transcript=false;save();render()}
function say(){if(!('speechSynthesis'in window)){alert('La synthèse vocale n’est pas disponible ici.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(audios[state.listening].script);u.lang='en-GB';u.rate=.84;speechSynthesis.speak(u)}
function question(q,key){return '<div class="line"><strong>'+esc(q[0])+'</strong>'+q[1].map((x,i)=>'<button class="choice '+(state.answers[key]===i?'sel':'')+'" data-key="'+key+'" data-value="'+i+'">'+esc(x)+'</button>').join('')+'</div>'}
function mark(){let r=texts[state.reading].q.reduce((n,q,i)=>n+(state.answers['r'+i]===q[2]?1:0),0);let l=audios[state.listening].q.reduce((n,q,i)=>n+(state.answers['l'+i]===q[2]?1:0),0);let g=state.grammar.reduce((n,id,i)=>n+(state.answers['g'+i]===grammar[id][2]?1:0),0);return {r,l,g,auto:Math.round(r/3*7.5+l/3*7.5+g),total:Math.round((r/3*7.5+l/3*7.5+g+(state.manualWriting||0)+(state.manualSpeaking||0))*10)/10}}
function submit(){const keys=[...Array.from({length:3},(_,i)=>'r'+i),...Array.from({length:3},(_,i)=>'l'+i),...Array.from({length:10},(_,i)=>'g'+i)];if(keys.some(k=>state.answers[k]===undefined)){alert('Réponds aux 16 questions avant de corriger.');return}state.submitted=true;save();render()}
function finalize(){if(!state.submitted||state.manualWriting===null||state.manualSpeaking===null){alert('Les deux compétences d’expression doivent être évaluées avant la validation.');return}let m=mark();state.history.push({date:new Date().toLocaleString('fr-FR'),score:m.total,passed:m.total>=32,reading:m.r,listening:m.l,grammar:m.g,writing:state.manualWriting,speaking:state.manualSpeaking});save();render()}
function render(){const m=mark(),t=texts[state.reading],a=audios[state.listening];let h='<div class="panel"><span class="pill">🌴 The Roots · Anglais A1.1</span><h1>Bilan des compétences</h1><p>Compréhension écrite et orale : <b>15 points</b>. Expression écrite et orale : <b>15 points</b>. Grammaire, verbes et vocabulaire : <b>10 points</b>.</p><p class="muted">Cette évaluation complémentaire ne remplace pas le contrôle de leçon. Les expressions nécessitent une évaluation humaine tant qu’un correcteur fiable n’est pas intégré.</p><button class="primary" id="new">🔄 Nouveau sujet / nouvel essai</button><a href="a11-complete.html">← Revenir aux cours</a></div>';
h+='<div class="panel"><h2>📖 Compréhension écrite · 7,5 pts</h2><strong>'+esc(t.title)+'</strong><p>'+esc(t.text)+'</p>'+t.q.map((q,i)=>question(q,'r'+i)).join('')+'</div>';
h+='<div class="panel"><h2>🎧 Compréhension orale · 7,5 pts</h2><p>Écoute puis réponds sans regarder le texte.</p><button class="primary" id="audio">▶ Écouter</button>'+a.q.map((q,i)=>question(q,'l'+i)).join('')+'<details><summary>Transcription (aide à la révision)</summary><p>'+esc(a.script)+'</p></details></div>';
h+='<div class="panel"><h2>⚙️ Grammaire, verbes, vocabulaire · 10 pts</h2>'+state.grammar.map((id,i)=>question(grammar[id],'g'+i)).join('')+'</div>';
h+='<div class="panel"><h2>✍️ Expression écrite · 7,5 pts</h2><p>Rédige 5 à 7 phrases en anglais : prénom, âge, origine, ville, profession ou études, description physique. Utilise au moins une négation et un possessif.</p><textarea id="writing" placeholder="Hello! My name is…">'+esc(state.writing)+'</textarea><p class="muted">Barème proposé : informations demandées 3 pts ; grammaire 2 pts ; vocabulaire 1,5 pt ; clarté 1 pt.</p><h2>🎤 Expression orale · 7,5 pts</h2><p>Présente-toi oralement pendant 30 à 60 secondes. Dis ton nom, ton âge, ton pays, ta ville, ton activité et décris un trait physique.</p><p class="muted">L’enregistrement et la reconnaissance vocale ne sont pas intégrés. L’apprenant peut s’entraîner à voix haute ; l’évaluation est manuelle.</p><textarea id="spoken" placeholder="Notes de l’évaluateur (facultatif)">'+esc(state.spoken)+'</textarea><p class="muted">Barème proposé : informations 3 pts ; intelligibilité 2 pts ; fluidité 1,5 pt ; interaction 1 pt.</p></div>';
h+='<div class="panel"><button class="primary" id="submit">'+(state.submitted?'Recalculer les QCM':'Corriger les QCM')+'</button>';
if(state.submitted){h+='<h2>Correction automatique : '+m.auto+'/25</h2><p>Lecture '+m.r+'/3 · Écoute '+m.l+'/3 · Grammaire '+m.g+'/10</p><p class="muted">Les 15 points d’expression ne sont pas attribués automatiquement.</p><label>Expression écrite / 7,5 <input id="mw" type="number" min="0" max="7.5" step=".5" value="'+(state.manualWriting??'')+'"></label><label>Expression orale / 7,5 <input id="ms" type="number" min="0" max="7.5" step=".5" value="'+(state.manualSpeaking??'')+'"></label><button class="primary" id="finalize">Enregistrer le bilan /40</button>';if(state.history.length){let last=state.history[state.history.length-1];h+='<p class="score">'+last.score+'/40</p><p><b>'+(last.passed?'Validé':'Non validé')+'</b> · seuil 32/40</p>'}h+='<details><summary>Voir les bonnes réponses</summary>'+[...t.q.map((q,i)=>['Lecture',q,'r'+i]),...a.q.map((q,i)=>['Écoute',q,'l'+i]),...state.grammar.map((id,i)=>['Grammaire',grammar[id],'g'+i])].map(([label,q,key])=>'<p>'+esc(label)+' : '+(state.answers[key]===q[2]?'✅':'❌')+' '+esc(q[0])+' → <b>'+esc(q[1][q[2]])+'</b></p>').join('')+'</details>'}
h+='</div><div class="panel"><h2>Historique des bilans</h2>'+(state.history.length?state.history.slice().reverse().map(x=>'<div class="line">'+esc(x.date)+' · '+x.score+'/40 · '+(x.passed?'Validé':'Échec')+'</div>').join(''):'<p class="muted">Aucun bilan enregistré.</p>')+'</div>';
app.innerHTML=h;
app.querySelector('#new').onclick=()=>{if(confirm('Générer un nouveau sujet ? Les réponses en cours seront remplacées.'))start()};
app.querySelector('#audio').onclick=say;
app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{state.answers[b.dataset.key]=Number(b.dataset.value);save();render()});
app.querySelector('#writing').oninput=e=>{state.writing=e.target.value;save()};
app.querySelector('#spoken').oninput=e=>{state.spoken=e.target.value;save()};
app.querySelector('#submit').onclick=submit;
let f=app.querySelector('#finalize');if(f)f.onclick=()=>{const w=Number(app.querySelector('#mw').value),o=Number(app.querySelector('#ms').value);if(!app.querySelector('#mw').value||!app.querySelector('#ms').value||![w,o].every(x=>Number.isFinite(x)&&x>=0&&x<=7.5)){alert('Saisis deux notes valides entre 0 et 7,5.');return}state.manualWriting=w;state.manualSpeaking=o;finalize()};
}
if(!state.grammar.length)start();else render();
</script></body></html>
