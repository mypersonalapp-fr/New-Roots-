<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Roots — A1.1 Maquette de test</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#202b32;background:#75c8ee}main{max-width:440px;margin:auto;min-height:100dvh;padding:22px 16px 95px;background:linear-gradient(180deg,#6fcaf7 0%,#d9f7fd 55%,#8fc779 100%);position:relative;overflow:hidden}main:before{content:"🌴";position:fixed;top:30px;right:max(calc((100vw - 440px)/2),0px);font-size:95px;opacity:.75;pointer-events:none}main:after{content:"🌺 🌿 🌴";position:fixed;bottom:0;left:0;width:100%;font-size:45px;opacity:.65;pointer-events:none}header{display:flex;align-items:center;gap:12px;margin-bottom:20px;position:relative;z-index:2}h1{font-size:23px;margin:0 0 8px}h2{font-size:20px;margin:0 0 10px}p{line-height:1.55}.panel{position:relative;z-index:2;background:rgba(255,255,255,.91);border:1px solid #fff;border-radius:22px;padding:20px;margin:13px 0;box-shadow:0 7px 25px #2d69732b;backdrop-filter:blur(8px)}button{border:0;cursor:pointer;font:inherit;font-weight:750}button.primary{background:#ec9a35;color:#fff;border-radius:13px;padding:13px 18px;width:100%;margin-top:10px}button.secondary{background:#fff2d6;border-radius:25px;padding:9px 15px}button.option{display:block;width:100%;background:#f4f9fc;border:1px solid #d4e4ed;border-radius:12px;padding:13px;text-align:left;margin:8px 0}button.option.selected{border:2px solid #e69528;background:#fff1d8}.line{padding:12px 0;border-bottom:1px solid #dce8ed}.small{color:#65727d;font-size:13px}.pill{display:inline-block;border-radius:22px;background:#f9e5bb;padding:7px 12px;color:#8b5818;font-size:13px}.progress{height:8px;border-radius:9px;background:#e0e9ee;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#e79a33}textarea{width:100%;min-height:125px;border:1px solid #c8dce5;border-radius:12px;padding:12px;font:inherit}nav{position:relative;z-index:2;display:flex;gap:10px;margin-top:15px}nav button{flex:1} .result{font-size:38px;color:#d98b26;font-weight:850;text-align:center}</style></head><body><main id="app"></main><script>
const DATA={"units":[["Vocabulaire","Identité et présentation",[["first name","prénom"],["last name","nom de famille"],["nickname","surnom"],["age","âge"],["date of birth","date de naissance"],["place of birth","lieu de naissance"],["country","pays"],["city","ville"],["nationality","nationalité"],["address","adresse"],["height","taille"],["weight","poids"],["eye colour","couleur des yeux"],["student","étudiant"],["teacher","enseignant"],["job","métier"]]],["Grammaire","Construire ses phrases",[["I / you / he / she / it / we / they","pronoms sujets"],["I am / you are / he is","to be au présent"],["I have / she has","to have au présent"],["I do / she does","to do au présent"],["I am not / she isn't","négation de be"],["I don't have / he doesn't have","négation de have"],["Do you live here?","question avec do"],["What is your name?","question avec be"],["my / your / his / her","adjectifs possessifs"],["this / that / these / those","démonstratifs"],["I'm / you're / he's","formes contractées"]]],["Lecture","Comprendre une présentation",[["Hello! My name is Emma. I am ten years old. I am from France. I live in Paris. I am a student. I have brown eyes.","Lis ce texte, puis réponds aux questions ci-dessous."]]],["Écoute","Comprendre une présentation orale",[["Hello, my name is Sam. I am twenty years old. I am British. I live in London. I have blue eyes.","Écoute le texte avec le bouton audio, puis réponds."]]],["Expression","Se présenter",[["My name is…","Je m'appelle…"],["I am … years old.","J'ai … ans."],["I am from…","Je viens de…"],["I live in…","J'habite à…"],["I am a student / I work as…","Je suis étudiant / je travaille comme…"],["I have … eyes.","J'ai les yeux…"]]]],"questions":[["Choose the correct form: I ___ French.",["am","is","are"],0],["She ___ 12 years old.",["am","is","are"],1],["We ___ students.",["is","are","am"],1],["___ is your name?",["Where","What","Who"],1],["Where ___ you from?",["are","is","do"],0],["I ___ not a teacher.",["is","am","are"],1],["He ___ have a car.",["don't","doesn't","isn't"],1],["___ you live in Paris?",["Are","Do","Does"],1],["This is ___ sister.",["my","I","me"],0],["Is this ___ book?",["you","your","you're"],1],["___ name is Tom (un garçon).",["His","Her","Their"],0],["___ is my bag (près de moi).",["These","This","Those"],1],["___ are my shoes (près de moi).",["This","These","That"],1],["I ___ two brothers.",["has","have","am"],1],["She ___ brown eyes.",["have","has","is"],1],["___ she a student?",["Do","Does","Is"],2],["What ___ you do?",["are","do","is"],1],["I ___ from London.",["come","comes","coming"],0],["Emma lives in…",["Paris","London","Rome"],0],["Emma is from…",["Canada","France","Spain"],1],["Emma has…",["brown eyes","green eyes","blue eyes"],0],["Sam lives in…",["Paris","London","Berlin"],1],["Sam is…",["British","French","Italian"],0],["Sam has…",["green eyes","blue eyes","brown eyes"],1],["How old is Sam?",["12","20","30"],1],["Select a correct answer: How old are you?",["I am 18 years old.","I have 18 years.","I is 18."],0],["Select a correct answer: Where do you live?",["I live in Lyon.","I am Lyon.","I have Lyon."],0],["Select a correct answer: What's your nationality?",["I am French.","I live France.","I have France."],0],["They ___ not from Spain.",["is","are","am"],1],["___ he have a sister?",["Do","Does","Is"],1],["She ___ a doctor.",["are","is","am"],1],["I ___ speak Italian.",["doesn't","don't","am not"],1],["___ is her name?",["What","Where","How many"],0],["My parents ___ from Canada.",["is","are","am"],1],["That is ___ house (à elle).",["her","she","hers"],0],["___ are those people?",["Who","Where","How old"],0],["How ___ are you?",["age","old","years"],1],["My ___ name is Smith.",["last","old","from"],0],["I was born ___ May.",["on","in","at"],1],["Nice to ___ you.",["meet","live","have"],0]]};let screen='home',section=0,step=0,answers={},textAnswer='';const app=document.getElementById('app');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>{try{return JSON.parse(localStorage.getItem('roots_a11_preview')||'{}')}catch(e){return {}}};const persist=()=>localStorage.setItem('roots_a11_preview',JSON.stringify({answers,textAnswer}));
Object.assign(window,{go:s=>{screen=s;step=0;render()},openSection:i=>{section=i;step=0;screen='unit';render()},next:()=>{step++;render()},prev:()=>{step=Math.max(0,step-1);render()},choose:(i,j)=>{answers[i]=j;persist();render()},write:v=>{textAnswer=v;persist()},speak:t=>{if(!('speechSynthesis'in window)){alert('Lecture audio indisponible sur ce navigateur');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)},reset:()=>{if(confirm('Effacer les réponses de cette maquette ?')){answers={};textAnswer='';persist();render()}}});
function render(){let h='<header><button class="secondary" onclick="go(\'home\')">‹ Retour</button><strong>The Roots · Anglais A1.1</strong></header>';
if(screen==='home')h+='<div class="panel"><span class="pill">🌴 Mes leçons · A1</span><h1>A1.1 — Mon identité</h1><p>Apprendre à se présenter, poser des questions, décrire son identité et comprendre une autre personne.</p><button class="primary" onclick="go(\'menu\')">Commencer la leçon →</button></div>';
if(screen==='menu'){h+='<div class="panel"><h1>A1.1 — Mon identité</h1><p class="small">Cours courts, exercices, compréhension et évaluation.</p></div>';DATA.units.forEach((u,i)=>h+='<div class="panel" onclick="openSection('+i+')" style="cursor:pointer"><strong>'+['📖','⚙️','📄','🎧','✍️'][i]+' '+escapeHtml(u[0])+'</strong><p class="small">'+escapeHtml(u[1])+' →</p></div>');h+='<div class="panel"><strong>🏅 Test de fin — 40 points</strong><button class="primary" onclick="go(\'quiz\')">Commencer le test</button></div>'}
if(screen==='unit'){let u=DATA.units[section],items=u[2];h+='<div class="panel"><span class="pill">'+(step+1)+' / '+items.length+'</span><h1>'+escapeHtml(u[0])+'</h1><h2>'+escapeHtml(u[1])+'</h2><div class="progress"><div style="width:'+((step+1)/items.length*100)+'%"></div></div><h2>'+escapeHtml(items[step][0])+'</h2><p>'+escapeHtml(items[step][1])+'</p>'+(section===3?'<button class="secondary" onclick="speak('+JSON.stringify(items[step][0]).replace(/"/g,'&quot;')+')">▶ Écouter</button>':'')+(section===4?'<textarea placeholder="Écris ta présentation en anglais…" oninput="write(this.value)">'+escapeHtml(textAnswer)+'</textarea>':'')+'</div><nav><button class="secondary" onclick="prev()">Précédent</button><button class="primary" onclick="'+(step+1===items.length?"go('menu')":"next()")+'">'+(step+1===items.length?'Terminer':'Suivant →')+'</button></nav>'}
if(screen==='quiz'){let i=step,q=DATA.questions[i];h+='<div class="panel"><span class="pill">Question '+(i+1)+' / 40</span><h1>Test de fin</h1><div class="progress"><div style="width:'+((i+1)/40*100)+'%"></div></div><h2>'+escapeHtml(q[0])+'</h2>'+q[1].map((a,j)=>'<button class="option '+(answers[i]===j?'selected':'')+'" onclick="choose('+i+','+j+')">'+escapeHtml(a)+'</button>').join('')+'</div><nav><button class="secondary" onclick="prev()">Précédent</button><button class="primary" '+(answers[i]===undefined?'disabled style="opacity:.5"':'')+' onclick="'+(i===39?"go('result')":"next()")+'">'+(i===39?'Voir le résultat':'Suivant →')+'</button></nav>'}
if(screen==='result'){let score=DATA.questions.reduce((s,q,i)=>s+(answers[i]===q[2]?1:0),0);h+='<div class="panel"><h1>🏅 Leçon terminée !</h1><p class="result">'+score+'/40</p><p>'+ (score>=32?'Très bon résultat.':'Revois les notions non maîtrisées et réessaie.')+'</p><h2>Correction</h2>'+DATA.questions.map((q,i)=>'<div class="line">'+(answers[i]===q[2]?'✅':'❌')+' '+escapeHtml(q[0])+'<br><strong>'+escapeHtml(q[1][q[2]])+'</strong></div>').join('')+'<button class="primary" onclick="go(\'menu\')">Retour aux leçons</button><button class="secondary" onclick="reset()">Réinitialiser le test</button></div>'}
app.innerHTML=h}
const old=saved();answers=old.answers||{};textAnswer=old.textAnswer||'';render();
</script></body></html>
