<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Roots — Transversale A1.1</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html{color-scheme:light dark;background:#fff}body{margin:0;color:#1b1d22;font-family:Manrope,system-ui,sans-serif;isolation:isolate}body:before,body:after{content:"";position:fixed;inset:0;z-index:-2;background:url("assets/img/shell-bg.jpg") center/cover no-repeat;pointer-events:none}body:before{filter:blur(35px);transform:scale(1.1)}body:after{z-index:-1;background-size:contain}main{max-width:460px;min-height:100dvh;margin:auto;padding:25px 16px 75px}.card{background:#fffffff0;border:1px solid #ffffffcc;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1423311b}h1,h2{font-family:Sora,system-ui,sans-serif}h1{font-size:24px}h2{font-size:18px}.muted{color:#52606c;font-size:13px}p{line-height:1.55}.pill{display:inline-block;background:#fbead0;color:#81541c;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:800}button,.btn{border:0;border-radius:13px;padding:13px;font:800 14px Manrope,system-ui,sans-serif;cursor:pointer}.btn{background:#e2a13d;color:white;display:block;text-decoration:none;text-align:center;width:100%;margin:9px 0}.secondary{background:#e8eeed;color:#1b3c39}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f3f6f8;border:1px solid #dce3e8}.choice.selected{border:2px solid #e2a13d;background:#fff2da}textarea{width:100%;min-height:100px;padding:12px;font:inherit;border-radius:12px;border:1px solid #cdd9df}nav{display:flex;gap:10px}nav>*{flex:1}.score{font-size:40px;font-weight:800;text-align:center;color:#ca831f}.progress{height:9px;background:#dfe7ed;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#e2a13d}.line{padding:12px 0;border-bottom:1px solid #e1e7eb}.audio{background:#e2a13d;color:white;margin-left:8px}.tiny{font-size:12px;color:#52606c}
@media(prefers-color-scheme:dark){html{background:#0e171d}body{color:#e7eef1}body:before,body:after{background-image:url("assets/img/shell-bg-dark.jpg")}.card{background:#16222aef;border-color:#3a5362;color:#e7eef1}.muted,.tiny{color:#b3c5ce}.choice{background:#1d2c35;color:#e7eef1;border-color:#405663}.choice.selected{background:#3b3a30}.secondary{background:#30414a;color:#e7eef1}.line{border-color:#425362}textarea{background:#1d2c35;color:white}}
</style></head><body><main id="app"></main><script>
const KEY='roots_a11_transversal_v1';
const sessions=[
{title:'Jour 1 · Se présenter',goal:'Prénom, nom et salutations',words:[['Hello','Bonjour'],['My name is…','Je m’appelle…'],['First name','Prénom'],['Last name','Nom de famille']],qs:[['My name ___ Emma.',['am','is','are'],1],['What is your ___ name?',['first','from','old'],0],['Nice to ___ you.',['meet','live','have'],0]],writing:'Écris trois phrases pour te présenter en anglais.'},
{title:'Jour 2 · Âge et nombres',goal:'Dire son âge et comprendre les nombres',words:[['How old are you?','Quel âge as-tu ?'],['I am twenty.','J’ai vingt ans.'],['Birthday','Anniversaire'],['Years old','Ans']],qs:[['I ___ 20 years old.',['have','am','is'],1],['Twenty-five =',['15','25','35'],1],['How ___ are you?',['many','old','from'],1]],writing:'Présente ton âge et la date de ton anniversaire.'},
{title:'Jour 3 · Origines et nationalités',goal:'Dire son pays, sa ville et sa nationalité',words:[['I am from France.','Je viens de France.'],['I live in Paris.','J’habite à Paris.'],['French','Français(e)'],['Where are you from?','D’où viens-tu ?']],qs:[['I am ___ Portugal.',['at','from','in'],1],['She ___ in London.',['live','lives','living'],1],['Where ___ you from?',['is','are','do'],1]],writing:'Écris ton pays d’origine, ta nationalité et ta ville.'},
{title:'Jour 4 · Être et avoir',goal:'Conjuguer be et have au présent',words:[['I am','Je suis'],['She is','Elle est'],['I have','J’ai'],['He has','Il a']],qs:[['They ___ students.',['is','are','am'],1],['She ___ blue eyes.',['have','has','is'],1],['I ___ not a doctor.',['am','is','do'],0]],writing:'Écris une phrase avec am, une avec is et une avec have.'},
{title:'Jour 5 · Questions et négation',goal:'Poser une question, répondre et nier',words:[['Are you…?','Es-tu… ?'],['Do you have…?','As-tu… ?'],['I am not','Je ne suis pas'],["She doesn't have",'Elle n’a pas']],qs:[['___ he British?',['Is','Does','Do'],0],['___ you have a sister?',['Are','Do','Is'],1],['She ___ not have a car.',['do','does','is'],1]],writing:'Écris deux questions et deux réponses négatives.'},
{title:'Jour 6 · Description et possessifs',goal:'Décrire une personne avec my, his, her',words:[['Brown eyes','Yeux marron'],['Blond hair','Cheveux blonds'],['My brother','Mon frère'],['Her name','Son prénom (à elle)']],qs:[['This is ___ mother.',['my','I','me'],0],['___ name is Paul (à lui).',['Her','His','Your'],1],['I ___ green eyes.',['has','am','have'],2]],writing:'Décris-toi en 4 phrases, dont une avec un possessif.'},
{title:'Jour 7 · Révision et transfert',goal:'Utiliser tout le vocabulaire dans une situation réelle',words:[['Nice to meet you.','Enchanté(e).'],['Where do you live?','Où habites-tu ?'],['What do you do?','Que fais-tu dans la vie ?'],['I am a student.','Je suis étudiant(e).']],qs:[['Where ___ she live?',['do','does','is'],1],['He ___ a teacher.',['is','are','am'],0],['___ are my friends.',['These','This','That'],0]],writing:'Rédige une présentation complète de 6 à 8 phrases. Puis lis-la à voix haute.'}
];
let state={day:0,answers:{},notes:{},attempts:[],finished:false};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;'}[c]));
function speak(t){if(!('speechSynthesis'in window)){alert('La synthèse vocale est indisponible.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.84;speechSynthesis.speak(u)}
function finish(){const s=sessions[state.day],a=state.answers[state.day]||{},score=s.qs.reduce((n,q,i)=>n+(a[i]===q[2]?1:0),0);state.attempts.push({day:state.day,score,passed:score>=3,date:new Date().toISOString()});state.finished=true;save();render()}
function render(){let s=sessions[state.day],a=state.answers[state.day]||{},h='<div class="card"><span class="pill">The Roots · A1.1 · Transversale</span><h1>7 jours pour ancrer les acquis</h1><p>Chaque jour : vocabulaire, prononciation, conjugaison, mini-contrôle et production personnelle.</p><a href="a11-complete.html" class="btn secondary">← Retour au cours A1.1</a></div><div class="card"><h2>Choisis ton jour</h2><nav style="flex-wrap:wrap">'+sessions.map((x,i)=>'<button style="flex:0 0 21%" class="'+(state.day===i?'btn':'secondary')+'" data-day="'+i+'">J'+(i+1)+'</button>').join('')+'</nav></div><div class="card"><span class="pill">'+s.title+'</span><h2>'+s.goal+'</h2><div class="progress"><div style="width:'+((state.day+1)/7*100)+'%"></div></div><h2>🔊 Écoute et répète</h2>'+s.words.map((w,i)=>'<div class="line"><strong>'+esc(w[0])+'</strong><button class="audio" data-audio="'+i+'" aria-label="Écouter '+esc(w[0])+'">🔊</button><p class="muted">'+esc(w[1])+'</p></div>').join('')+'<h2>🧩 Entraînement</h2>'+s.qs.map((q,i)=>'<div class="line"><b>'+(i+1)+'. '+esc(q[0])+'</b>'+q[1].map((x,j)=>'<button class="choice '+(a[i]===j?'selected':'')+'" data-q="'+i+'" data-answer="'+j+'">'+esc(x)+'</button>').join('')+'</div>').join('')+'<h2>✍️ Expression écrite et orale</h2><p>'+esc(s.writing)+'</p><textarea id="notes" placeholder="Écris ici ta réponse…">'+esc(state.notes[state.day]||'')+'</textarea><p class="tiny">Lis ensuite tes phrases à voix haute. La prononciation n’est pas notée automatiquement.</p><button class="btn" id="correct">Corriger mon entraînement</button>';
if(state.finished){let last=state.attempts[state.attempts.length-1];h+='<h2>'+(last.passed?'🎉 Réussi':'📘 À revoir')+'</h2><p class="score">'+last.score+'/3</p>'+s.qs.map((q,i)=>'<p>'+(a[i]===q[2]?'✅':'❌')+' '+esc(q[0])+' → <b>'+esc(q[1][q[2]])+'</b></p>').join('')+'<button class="btn" id="retry">Recommencer</button><button class="btn secondary" id="next">Jour suivant →</button>'}
h+='</div><div class="card"><h2>Suivi des tentatives</h2>'+(state.attempts.length?state.attempts.slice().reverse().map(x=>'<p class="tiny">Jour '+(x.day+1)+' · '+x.score+'/3 · '+(x.passed?'Validé':'Échec')+'</p>').join(''):'<p class="muted">Aucune tentative pour le moment.</p>')+'</div>';document.getElementById('app').innerHTML=h;
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;state.finished=false;save();render()});
document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>speak(s.words[+b.dataset.audio][0]));
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{(state.answers[state.day] ||= {})[+b.dataset.q]=+b.dataset.answer;save();render()});
document.getElementById('notes').oninput=e=>{state.notes[state.day]=e.target.value;save()};
document.getElementById('correct').onclick=()=>{if(Object.keys(state.answers[state.day]||{}).length<3){alert('Réponds aux trois questions avant la correction.');return}finish()};
if(state.finished){document.getElementById('retry').onclick=()=>{state.answers[state.day]={};state.finished=false;save();render()};document.getElementById('next').onclick=()=>{state.day=Math.min(6,state.day+1);state.finished=false;save();render()}}
}render();
</script></body></html>
