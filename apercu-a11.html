<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>The Roots — Aperçu leçon A1.1</title>
  <link rel="icon" type="image/png" href="assets/img/app-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=20260930a"/>
  <link rel="stylesheet" href="css/backgrounds.css?v=20260930a"/>
  <link rel="stylesheet" href="css/screens.css?v=20261001c"/>
  <link rel="stylesheet" href="css/lecon-a11.css?v=20261018z"/>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // Aperçu direct de la leçon A1.1 (sans connexion ni test de niveau).
    // Options dans l'adresse : ?g=girl|boy  &i=0..8 (personnage)  &t=light|dark
    import { store } from "./js/data/store.js?v=20260930a";
    const q = new URLSearchParams(location.search);
    const patch = {};
    if (q.get("g") === "girl" || q.get("g") === "boy") patch.avatarGender = q.get("g");
    if (q.has("i")) patch.avatarIndex = Math.max(0, Math.min(8, Number(q.get("i")) || 0));
    if (q.get("t") === "light" || q.get("t") === "dark") patch.theme = q.get("t");
    if (Object.keys(patch).length) store.updateSettings(patch);
    document.documentElement.setAttribute("data-theme", store.get().settings.theme || "light");
    const { renderLessonA11 } = await import("./js/screens/lecon-a11.js?v=20261018z");
    renderLessonA11(document.getElementById("app"), { onExit: () => location.reload() });
  </script>
</body>
</html>
