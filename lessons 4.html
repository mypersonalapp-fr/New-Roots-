    return '<div class="exam-ai">' +
      '<div class="exam-ai-score">'+(r.skipped ? "⏭️ Partie passée (mode créatrice) — non corrigée" : "🤖 Correction de l'IA : <b>"+examFmt(r.score)+" / "+r.max+"</b>")+'</div>' +
      (ai.feedback ? '<div class="exam-ai-fb">'+examEsc(ai.feedback).replace(/\n/g, "<br>")+'</div>' : "") +
      (ai.strengths ? '<div class="exam-ai-good">👍 '+examEsc(ai.strengths)+'</div>' : "") +
      (ai.corrections && ai.corrections.length ? '<div class="exam-ai-sub">À corriger</div><ul class="exam-ai-corr">'+ai.corrections.map(function(c){ return '<li>'+examEsc(c)+'</li>'; }).join("")+'</ul>' : "") +
      '</div>';
  }
  function examAiHtml(S, d, res){
    var oral = S.type === "ai-oral";
    var text = examAiText(S, d);
    var locked = !!res || examUi.busy;
    var micOk = !!SpeechRec;
    var recording = !!(examUi.rec && examUi.rec.running);
    var quotes = (S.quotes && S.quotes.length) ? '<div class="q-passage">'+S.quotes.map(function(q){ return '<div><b>'+examEsc(q)+'</b></div>'; }).join("")+'</div>' : "";
    var prompt = '<div class="exam-prompt"><b>'+examEsc(S.prompt)+'</b><div class="exam-fr">'+examEsc(S.promptFr)+'</div></div>';
    var mic = "";
    if(oral){
      mic = micOk
        ? '<div class="exam-mic-row"><button type="button" class="btn btn-ghost exam-mic'+(recording ? " recording" : "")+'" id="examMic"'+(locked ? " disabled" : "")+'>'+(recording ? "⏹ Stop" : (text.trim() ? "🎤 Continue speaking" : "🎤 Start speaking"))+'</button>' +
          '<span class="exam-timer" id="examTimer">'+(recording ? "⏺ 0 s" : (S.targetSeconds ? "≈ " + S.targetSeconds + " s" : ""))+'</span>' +
          (!locked && text.trim() ? '<button type="button" class="btn btn-ghost" id="examMicReset">↺ Try again</button>' : "") + '</div>' +
          '<div class="exam-fr">'+(recording ? "Je t'écoute… appuie sur Stop quand tu as fini." : (text.trim() ? "« Continue » ajoute à ta réponse, « Try again » efface tout pour recommencer." : "Appuie sur le micro, parle, puis appuie sur Stop."))+'</div>'
        : '<div class="why-inline"><span class="icon">🎤</span><div>Le micro n\'est pas disponible sur ce navigateur : écris ce que tu dirais à l\'oral (la note de fluidité en tiendra compte).</div></div>';
    }
    var area = '<textarea class="desc-area exam-text" id="examText" rows="'+(oral ? 6 : (S.maxWords && S.maxWords > 100 ? 12 : 7))+'" placeholder="'+(oral ? "Your words will appear here… (you can also type) / Tes paroles s'affichent ici… (tu peux aussi écrire)" : "Write your answer here… / Écris ta réponse ici…")+'"'+(locked || recording ? " disabled" : "")+'>'+examEsc(text)+'</textarea>' +
      '<div class="exam-count" id="examCount">'+examCountHtml(S, text)+'</div>' +
      (oral ? '<div class="exam-fr">🎤 L\'IA n\'entend pas ta voix : elle lit ce que le micro a compris (et son taux de confiance). Si le micro se trompe de mot, c\'est souvent un son à travailler.</div>' : "");
    var status = "";
    if(examUi.busy) status = '<div class="exam-ai exam-busy"><span class="exam-spin" aria-hidden="true"></span> L\'IA corrige ta réponse… (quelques secondes)</div>';
    else if(!res && examUi.error){
      status = '<div class="exam-err"><b>'+examEsc(examUi.error)+'</b>' +
        '<div class="exam-actions"><button type="button" class="btn btn-primary" id="examRetry" style="margin-left:0">Réessayer</button>' +
        '<button type="button" class="btn btn-ghost" id="examLater">Revenir plus tard</button>' +
        (CREATOR_MODE ? '<button type="button" class="btn btn-ghost" id="examSkip">Passer (mode créatrice)</button>' : "") + '</div>' +
        '<div style="margin-top:8px;font-size:.8rem">Tes réponses sont gardées sur ce téléphone : rien n\'est perdu.' + (CREATOR_MODE ? "" : " L'examen ne peut pas être terminé sans cette correction.") + '</div></div>';
    }
    return examPassageHtml(S) + quotes + prompt + mic + area + status +
      (res ? (examShowCorr(d) ? examAiResultHtml(res) : '<div class="exam-ok" style="color:var(--ink-soft,#555)">✓ Réponse envoyée et corrigée. Ta note et les commentaires de l\'IA s\'affichent à la fin de l\'examen.</div>') : "");
  }
  function wireExamAi(S, d, res){
    var ta = document.getElementById("examText");
    var oral = S.type === "ai-oral";
    if(ta && !res) ta.addEventListener("input", function(){
      if(oral){ var a = examAiAnswer(S, d); a.text = ta.value; a.typed = true; d.answers[S.id] = a; }
      else d.answers[S.id] = ta.value;
      examUi.confirm = false; examUi.confirmMsg = "";
      document.getElementById("examCount").innerHTML = examCountHtml(S, ta.value);
      examSaveDraft();
    });
    var mic = document.getElementById("examMic");
    if(mic) mic.addEventListener("click", function(){ examToggleMic(S, d); });
    var reset = document.getElementById("examMicReset");
    if(reset) reset.addEventListener("click", function(){
      d.answers[S.id] = { text:"", confs:[], typed:false, micUsed:false };
      examUi.confirm = false; examUi.confirmMsg = "";
      examSaveDraft(); render();
    });
    var retry = document.getElementById("examRetry");
    if(retry) retry.addEventListener("click", function(){ examUi.error = ""; examValidate(S, d, true); });
    var later = document.getElementById("examLater");
    if(later) later.addEventListener("click", function(){ examSaveDraft(); window.location.href = "index.html"; });
    var skip = document.getElementById("examSkip");
    if(skip) skip.addEventListener("click", function(){
      if(!CREATOR_MODE) return;
      d.results[S.id] = { score:0, max:S.points, skipped:true, ai:{ feedback:"Partie passée en mode créatrice : elle compte 0 point." } };
      examUi.error = ""; examSaveDraft(); render();
    });
  }
  function examStopMic(){
    if(examUi && examUi.rec){
      var r = examUi.rec;
      r.running = false;
      if(r.timer){ clearInterval(r.timer); r.timer = null; }
      try { r.obj && r.obj.stop(); } catch(e){}
    }
  }
  // Micro : reconnaissance vocale du navigateur (en-GB ou en-US selon la variante), en continu ;
  // on garde les confiances de chaque morceau reconnu (envoyées à l'IA, comme la Conversation IA).
  function examToggleMic(S, d){
    if(!SpeechRec) return;
    if(examUi.rec && examUi.rec.running){ examStopMic(); render(); return; }
    var a = examAiAnswer(S, d);
    var base = (a.text || "").trim();
    var r = { running:true, finals:[], start:Date.now(), timer:null, obj:null };
    examUi.rec = r;
    function current(interim){
      var t = r.finals.join(" ").trim();
      if(interim) t = (t + " " + interim).trim();
      return (base ? base + (t ? " " : "") : "") + t;
    }
    function commit(){
      var ans = examAiAnswer(S, d);
      ans.text = current("");
      ans.micUsed = true;
      d.answers[S.id] = ans;
      examSaveDraft();
    }
    try {
      window.speechSynthesis && window.speechSynthesis.cancel();
      var rec = new SpeechRec();
      r.obj = rec;
      rec.lang = state.variant === "us" ? "en-US" : "en-GB";
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.onresult = function(e){
        var interim = "";
        for(var i = e.resultIndex; i < e.results.length; i++){
          var alt = e.results[i][0];
          if(e.results[i].isFinal){
            r.finals.push(alt.transcript.trim());
            var ans = examAiAnswer(S, d);
            ans.confs = (ans.confs || []).concat(typeof alt.confidence === "number" && alt.confidence > 0 ? [alt.confidence] : []);
            d.answers[S.id] = ans;
          } else interim += alt.transcript;
        }
        commit();
        var ta = document.getElementById("examText");
        if(ta){ ta.value = current(interim); var c = document.getElementById("examCount"); if(c) c.innerHTML = examCountHtml(S, ta.value); }
      };
      rec.onerror = function(){ if(examUi && examUi.rec === r && r.running){ examStopMic(); render(); } };
      rec.onend = function(){ if(examUi && examUi.rec === r && r.running){ examStopMic(); commit(); render(); } };
      r.timer = setInterval(function(){
        var t = document.getElementById("examTimer");
        if(t) t.textContent = "⏺ " + Math.round((Date.now() - r.start) / 1000) + " s";
      }, 1000);
      render();
      rec.start();
    } catch(err){ examStopMic(); render(); }
  }

  // Appel au relais IA (mode "grade") — voir cloudflare-worker-gemini.js.
  function examGradeAi(S, answer, mic){
    var body = {
      mode:"grade", lang:"en", variant: state.variant === "us" ? "en-us" : "en-gb", level: levelOfLesson(state.lesson),
      task:{
        title: examName() + " – " + S.num + ". " + S.title,
        instructions: (S.passage ? "Source text given to the learner: " + String(S.passage) + " — " : "") + S.instructions + (S.quotes && S.quotes.length ? " " + S.quotes.join(" ") : "") + (S.prompt ? " Task: " + S.prompt : "") +
          (S.minWords ? " Expected length: " + S.minWords + (S.maxWords ? "-" + S.maxWords : "+") + " words." : ""),
        rubric: S.rubric || "", maxPoints: S.points, reference: S.reference || "",
        kind: S.type === "ai-oral" ? "oral" : "text"
      },
      answer: answer
    };
    if(mic) body.mic = mic;
    return new Promise(function(resolve, reject){
      if(!/^https:\/\//.test(EXAM_AI_RELAY_URL || "")){ reject(new Error("not_configured")); return; }
      var ctrl = window.AbortController ? new AbortController() : null;
      var done = false;
      var to = setTimeout(function(){ if(done) return; done = true; try { ctrl && ctrl.abort(); } catch(e){} reject(new Error("timeout")); }, 30000);
      fetch(EXAM_AI_RELAY_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined })
        .then(function(res){ return res.json().catch(function(){ return {}; }).then(function(data){ return { ok:res.ok, data:data || {} }; }); })
        .then(function(r){
          if(done) return; done = true; clearTimeout(to);
          var g = r.data, sc = Number(g.score);
          if(!r.ok || typeof g.score !== "number" || !isFinite(sc)){ reject(new Error(g.error || "relay_error")); return; }
          resolve({
            score: Math.round(Math.max(0, Math.min(S.points, sc)) * 2) / 2,
            max: S.points,
            ai:{ feedback: String(g.feedback || ""), strengths: String(g.strengths || ""),
                 corrections: Array.isArray(g.corrections) ? g.corrections.filter(function(c){ return typeof c === "string"; }).slice(0, 8) : [] }
          });
        })
        .catch(function(e){ if(done) return; done = true; clearTimeout(to); reject(e); });
    });
  }
  function examErrorText(code){
    if(code === "quota_exceeded") return "L'IA a atteint sa limite pour le moment. Réessaie dans une minute.";
    if(code === "not_configured") return "La correction par l'IA n'est pas encore branchée (adresse du relais manquante).";
    return "L'IA ne répond pas pour l'instant (connexion ou relais). Réessaie, ou reviens plus tard.";
  }

  // ---------- Validation d'une section / navigation ----------
  function examValidate(S, d, force){
    if(d.results[S.id] || examUi.busy) return;
    var empty = 0, msg = "";
    if(S.type === "fill"){ empty = examFillEmpty(S, d); if(empty) msg = "Il reste "+empty+" trou"+(empty > 1 ? "s" : "")+" vide"+(empty > 1 ? "s" : "")+". Tu peux les remplir, ou valider quand même (0 point pour un trou vide)."; }
    else if(S.type === "mcq"){ empty = examMcqEmpty(S, d); if(empty) msg = empty+" question"+(empty > 1 ? "s" : "")+" sans réponse. Tu peux répondre, ou valider quand même (0 point)."; }
    else {
      var n = examWords(examAiText(S, d));
      if(!n) msg = "Ta réponse est vide : écris (ou dis) quelque chose avant de valider.";
      else if(S.minWords && n < S.minWords) msg = "Ta réponse fait "+n+" mot"+(n > 1 ? "s" : "")+" (attendu : "+S.minWords+(S.maxWords ? " à "+S.maxWords : " minimum")+"). Tu peux la compléter, ou valider quand même.";
      if(!n){ examUi.confirmMsg = msg; examUi.confirm = false; render(); return; }
    }
    if(msg && !force && !examUi.confirm){ examUi.confirm = true; examUi.confirmMsg = msg; render(); return; }
    examUi.confirm = false; examUi.confirmMsg = "";
    if(S.type === "fill" || S.type === "mcq"){
      d.results[S.id] = S.type === "fill" ? examGradeFill(S, d) : examGradeMcq(S, d);
      examSaveDraft(); render(); window.scrollTo(0, 0);
      return;
    }
    examStopMic();
    var a = examAiAnswer(S, d), mic = null;
    if(S.type === "ai-oral"){
      var confs = a.confs || [], avg = confs.length ? confs.reduce(function(x, y){ return x + y; }, 0) / confs.length : 0;
      mic = { confidence: avg ? Math.round(avg * 100) / 100 : null, typed: !!a.typed || !a.micUsed };
    }
    examUi.busy = true; examUi.error = "";
    render();
    var lesson = state.lesson;
    examGradeAi(S, examAiText(S, d), mic).then(function(r){
      if(!examUi || examUi.lesson !== lesson) return;
      examUi.busy = false;
      d.results[S.id] = r;
      recordSkill(S.skill || "ee", r.score / r.max >= 0.6);
      examSaveDraft(); render();
    }, function(e){
      if(!examUi || examUi.lesson !== lesson) return;
      examUi.busy = false;
      examUi.error = examErrorText(e && e.message);
      examSaveDraft(); render();
    });
  }
  // Bouton principal (nextBtn) pendant l'examen — appelé par goNext.
  function examPrimaryAction(){
    var d = examDraft();
    if(examUi.busy) return;
    if(d.done && d.result){ state.examResult = d.result; state.step = 6; render(); return; }
    if(d.sec < 0 || d.sec >= EXAM.sections.length){
      var started = Object.keys(d.results).length > 0 || Object.keys(d.answers).length > 0;
      if(!started && !retakeStatus(EXAM.code).ok) return;
      if(d.sec < 0) d.sec = 0;
      var firstTodo = 0;
      while(firstTodo < EXAM.sections.length - 1 && d.results[EXAM.sections[firstTodo].id]) firstTodo++;
      d.sec = firstTodo;
      examSaveDraft(); render(); window.scrollTo(0, 0);
      return;
    }
    var S = EXAM.sections[d.sec];
    if(!d.results[S.id]){ examValidate(S, d, false); return; }
    examStopMic();
    if(d.sec < EXAM.sections.length - 1){
      d.sec++; examUi.error = ""; examUi.confirm = false; examUi.confirmMsg = "";
      examSaveDraft(); render(); window.scrollTo(0, 0);
      return;
    }
    examFinalize(d);
    state.step = 6;
    render(); window.scrollTo(0, 0);
  }

  // ---------- Note finale → résultat compatible avec les contrôles existants ----------
  function examFinalize(d){
    var total = 0, max = 0, sk = {}, rows = [];
    EXAM.sections.forEach(function(S){
      var r = d.results[S.id] || { score:0, max:S.points };
      total += r.score; max += S.points;
      var k = S.skill || "gr"; sk[k] = sk[k] || [0, 0]; sk[k][0] += r.score; sk[k][1] += S.points;
      rows.push({ id:S.id, num:S.num, title:S.title, titleFr:S.titleFr, type:S.type, score:r.score, max:S.points, ai:r.ai || null, skipped:!!r.skipped });
    });
    total = Math.round(total * 10) / 10;
    var pct = max ? Math.round(total / max * 100) : 0;
    var skills = {};
    Object.keys(sk).forEach(function(k){ skills[k] = sk[k][1] ? Math.round(sk[k][0] / sk[k][1] * 100) : null; });
    var decision = pct < 70 ? "fail" : (pct < 80 ? "renfort" : (pct < 93 ? "rappel" : "net"));
    var floor = Object.keys(skills).filter(function(k){ return skills[k] != null && skills[k] < 50; });
    // Le palier lui-même est la « leçon à consolider » (renfort / rappels vers les leçons B1 suivantes).
    // En cas d'échec, pas de leçon imposée (weak vide) : seul le délai d'une semaine s'applique.
    // Grand contrôle « examen seul » : pas de leçon à refaire en renfort (il n'y a pas de leçon) ;
    // les jauges par compétence gardent la trace des points faibles.
    var ev = { pct:pct, total:total, max:max, skills:skills, decision:decision, floor:floor,
      weak: (decision === "fail" || STANDALONE) ? [] : [state.lesson], floorLessons: (floor.length && !STANDALONE) ? [state.lesson] : [] };
    saveControlResult(EXAM.code, ev);
    if(decision !== "fail"){ grantAiCredit(); recordPass(state.lesson); }
    d.done = true;
    d.result = { code:EXAM.code, label:EXAM.label || "", variant:examVariant(), pct:pct, total:total, max:max, decision:decision, skills:skills, floor:floor, rows:rows, at:Date.now() };
    examSaveDraft();
    state.examResult = d.result;
  }

  // Corrigé d'une section écrite/orale corrigée par l'IA (bilan) : sujet, réponse de l'apprenant,
  // note et retour de l'IA, puis les éléments attendus / réponse type (champ reference).
  function examAiReviewHtml(S, d, r){
    var text = examAiText(S, d);
    return '<div class="exam-prompt"><b>'+examEsc(S.prompt || "")+'</b><div class="exam-fr">'+examEsc(S.promptFr || "")+'</div></div>' +
      '<div class="exam-ai-sub">Ta réponse</div><div class="q-passage">'+(text.trim() ? examEsc(text).replace(/\n/g, "<br>") : "<i>(pas de réponse)</i>")+'</div>' +
      examAiResultHtml(r) +
      (S.reference ? '<div class="exam-ai-sub">Éléments attendus / réponse type</div><div class="q-passage">'+examEsc(S.reference).replace(/\n/g, "<br>")+'</div>' : "");
  }
  function examCorrigeHtml(){
    var dd = examPeekDraft();
    if(!dd || !dd.done) return "";
    return '<div class="card" style="padding:14px 16px;margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">📖 Corrigé complet</div>' +
      '<p class="lede" style="font-size:.84rem;margin:0 0 6px">Touche une section pour voir tes réponses, les bonnes réponses et les explications.</p>' +
      EXAM.sections.map(function(S){

      : (rs && rs.creator ? '<p class="lede" style="font-size:.85rem">Mode créatrice : nouvel essai possible tout de suite.</p>' : '<p class="lede" style="font-size:.9rem">Nouvel examen possible à partir du <b>'+fmtDate(Date.now() + 7 * DAY_MS)+'</b>.</p>');

  // ---------- Conversation IA débloquée par une leçon réussie (23/09) ----------
  // Même clé et même format que js/data/ai-credits.js (l'appli principale) :
  // 1 conversation par leçon réussie (refaire la même leçon n'en redonne pas),
  // cumulables, 3 max utilisées par jour (compté côté appli principale).
  function grantAiCredit(){
    try {
      var KEY = "the_roots_ai_v1";
      var data = JSON.parse(localStorage.getItem(KEY) || "null") || { credits: [], active: null, welcomeGiven: false };
      if(!Array.isArray(data.credits)) data.credits = [];
      var id = (ES_MODE ? "es-" : "en-") + state.lesson;
      if(data.credits.some(function(c){ return c.id === id; })) return false;
      var d = new Date();
      var today = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      data.credits.push({ id: id, lang: LANG, level: levelOfLesson(state.lesson),
        topic: lessonLabel() + (ES_MODE ? (esTitle(state.lesson) ? " — " + esTitle(state.lesson) : "") : (META && META.vocabTitle ? " — " + META.vocabTitle : "")),
        lede: (META && META.todayLede) || "", earnedAt: today, usedAt: null });
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch(e){ return false; }
  }

    // suivante dans l'ordre pédagogique (B1.0 → B1.1, B1.12 → B2.0 → B2.1, B2.12 → C1.0 → C1.1,

    var isB = isBLesson(state.lesson);

    var gaugesHtml = lessonGaugesHtml();
    screen.innerHTML =
      '<div class="eyebrow">Bilan de session</div>' +
      '<h2 class="screen-title">'+(passed ? META.bilanTitle : "Cette leçon a besoin d\'être consolidée.")+'</h2>' +

    nextBtn.textContent = (passed && state.returnTo != null) ? ((state.returnTo === 13 || state.returnTo === b1EntryLesson() || state.returnTo === c1EntryLesson()) ? "Retour à mes renforts" : "Retour au contrôle") : passed
      ? (hasNext ? "Passer à " + (isB ? bCode(nextB) : (isA2 ? "A2." + (state.lesson+1-13) : "la leçon " + (state.lesson+2))) : (isB ? "Revoir mes leçons (la suite arrive bientôt)" : "Passer au grand contrôle " + (isA2 ? "A2" : "A1")))

    // Pendant une leçon revue à la demande d'un contrôle/renfort, on ne déplace pas la progression.
    if(state.returnTo == null){ try { var __sv = parseInt(localStorage.getItem(LESSON_KEY), 10); if(isNaN(__sv) || lessonRank(state.lesson) >= lessonRank(__sv) || isEsBlocage(state.lesson)) localStorage.setItem(LESSON_KEY, String(state.lesson)); } catch(e){} pickMaxSave(); }
    if(state.variant){ document.documentElement.setAttribute("data-flag", state.variant); }
    else { document.documentElement.removeAttribute("data-flag"); }
    updateRouteChip();
    nextBtn.style.display = "";
    nextBtn.disabled = false;
    state.gateOpen = false;
    if(state.restartPage){ itinerary.hidden = true; screenRestart(); return; }
    if(state.lessonsPage && !STANDALONE){ itinerary.hidden = true; screenLessons(); return; }
    if(state.lesson === 13 && state.step === 0 && !state.renfortSkipped && state.returnTo == null){
      var renfortTodo = pendingRenforts("A2");
      if(renfortTodo.length){ state.gateOpen = true; screenRenfortGate(renfortTodo, "A2"); return; }
    }
    // Même porte à l'entrée du niveau B1 (B1.0 s'il est déposé, sinon B1.1 — voir b1EntryLesson) :
    // renforts du contrôle A2 / du grand contrôle final.
    if(state.lesson === b1EntryLesson() && state.step === 0 && !state.renfortSkipped && state.returnTo == null){
      // (Les renforts ajoutés par un examen de palier B1 — le palier lui-même — ne bloquent pas l'entrée
      // en B1 : ils se refont depuis Mes cours › Mes renforts. Tri dans l'ordre pédagogique.)
      var renfortTodoB1 = pendingRenforts("B1").filter(function(id){ return lessonRank(id) < lessonRank(b1EntryLesson()); });
      if(renfortTodoB1.length){ state.gateOpen = true; screenRenfortGate(renfortTodoB1, "B1"); return; }
    }
    // Porte de renforts à l'entrée du niveau C1 (C1.0 s'il est déposé, sinon C1.1), sur le modèle de la
    // porte B1. AUJOURD'HUI ELLE NE S'OUVRE JAMAIS : aucun contrôle n'écrit de renforts « C1 » venant
    // d'un niveau inférieur (pas de Grand Contrôle B2 ; les examens de palier B2 rangent leurs renforts
    // en « B2 », voir nextLevelOf ; ceux des examens C1 visent des paliers C1, exclus par le filtre).
    // Le jour où un Grand Contrôle B2 existera, il suffira que nextLevelOf() renvoie "C1" pour son code
    // (saveControlResult range alors ses renforts sous « C1 ») pour que cette porte s'ouvre.
    if(state.lesson === c1EntryLesson() && state.step === 0 && !state.renfortSkipped && state.returnTo == null){
      var renfortTodoC1 = pendingRenforts("C1").filter(function(id){ return lessonRank(id) < lessonRank(c1EntryLesson()); });
      if(renfortTodoC1.length){ state.gateOpen = true; screenRenfortGate(renfortTodoC1, "C1"); return; }
    }
    if(isGrandControle()){
      itinerary.hidden = true;
      postmark.innerHTML = state.lesson === GRAND_CONTROLE_A2_LESSON ? "GRAND<br>CTRL A2" : "GRAND<br>CONTRÔLE";
      if(state.step === 0) screenGCAccueil();
      else if(state.step === 1) renderSentenceBuilder();
      else if(state.step === 2) screenControle();
      else screenGCBilan();
      return;
    }
    if(STANDALONE){

      itinerary.hidden = true;
      if(state.step < 5) state.step = 5;
      if(state.step === 5) screenExam();
      else if(state.examResult) screenExamBilan();
      else { state.step = 5; screenExam(); }
      return;
    }
    if(ES_MODE && state.step === 0 && esNoAntecedent()){ state.step = 1; state.subStep = 0; vocabBlockIdx = 0; }
    somOpen.hidden = false; viewOpen.hidden = true;
    if(state.pick){ itinerary.hidden = true; screenViewModes(); return; }
    if(state.hub){ itinerary.hidden = true; screenSommaire(); return; }
    if(state.step === 0 || state.step >= 6) state.ficheRun = false;
    somOpen.textContent = (FICHE() && state.ficheRun) ? "📄 Retour à la fiche" : "☰ Plan de la leçon";

    itinerary.hidden = state.step === 0;

    else if(state.step === 5){ if(examActive()) screenExam(); else screenControle(); }
    else if(examActive() && state.examResult) screenExamBilan();

  // Unités de l'ordre du déroulé (écran du moteur + étapes du déroulé qu'il couvre).
  function guidedUnits(){

      if(DRILLS) U.push({step:1, sub:drillsSubstep(), rows:[6]});
    }
    for(var k = 0; k < LECTURE_SUBSTEPS; k++) U.push({step:4, sub:k, rows:[7,8]});
    if(hasLecon) U.push({step:1, sub:lastSub, rows:[9]});
    U.push({step:2, sub:0, rows:[10]});
    U.push({step:5, sub:0, rows:[11]});
    U.push({step:6, sub:0, rows:[12,13]});
    return U;
  }
  function guidedIndex(U, st, sub){ for(var i = 0; i < U.length; i++){ if(U[i].step === st && U[i].sub === sub) return i; } return -1; }
  function guidedGo(u){

  var cardQ = null, cardPos = 0, cardFlip = false;

  function renderVocabCards(){
    if(!cardQ || cardQ.lesson !== state.lesson){

    }
    if(cardPos > cardQ.length-1) cardPos = cardQ.length-1;
    var v = VOCAB[cardQ[cardPos]], last = cardPos >= cardQ.length-1;
    var vis = vocabVisual(v), exHtml = vocabExample(v);

  // Avance d'une carte ; renvoie false quand il n'y a plus de carte (le moteur prend alors le relais).
  function cardsNext(){
    if(cardPos < cardQ.length-1){ cardPos++; cardFlip = false; renderVocabCards(); return true; }
    return false;
  }
  function cardsIntercept(dir){
    if(!(CARDS() && !state.hub && !state.pick && !state.gateOpen && state.step === 1 && state.subStep === 0) || discoverPending()) return false;
    if(!cardQ) renderVocabCards();
    if(dir > 0){
      if(!cardFlip){ cardFlip = true; renderVocabCards(); return true; }
      if(cardsNext()) return true;
      vocabBlockIdx = vocabBlocks().length-1; cardsReset(); return false;
    }
    if(cardFlip){ cardFlip = false; renderVocabCards(); return true; }
    if(cardPos > 0){ cardPos--; renderVocabCards(); return true; }
    cardsReset(); return false;
  }

  function guidedWrap(fn, dir){
    return function(){
      if(cardsIntercept(dir)) return;
      if(!GUIDED() || state.hub || state.pick || state.gateOpen){ return fn(); }
      var b0 = state.step, b1 = state.subStep;
      fn();
      if(state.step === b0 && state.subStep === b1) return;      // simple défilement interne (pages, questions…)
      if(b0 === 0 || b0 >= 6) return;
      var U = guidedUnits(), i = guidedIndex(U, b0, b1);
      if(i < 0) return;
      var j = i + dir;
      if(j < 0 || j >= U.length) return;
      if(U[j].step === state.step && U[j].sub === state.subStep) return;
      guidedGo(U[j]);
    };
  }

            // A1 validé : on enchaîne sur le niveau A2 (A2.0), précédé des renforts éventuels.
            state.lesson = 13; state.step = 0; state.reviewDone = false; state.reviewLog = []; state.renfortSkipped = false;
          } else if(state.lesson === GRAND_CONTROLE_A2_LESSON){
            // A2 validé : place au grand contrôle final (A1 + A2).
            state.lesson = GRAND_CONTROLE_FINAL_LESSON; state.step = 0;
          } else {
            // Final validé : on enchaîne sur le niveau B1 (B1.0 s'il est déposé, sinon B1.1), précédé
            // des renforts éventuels (comme A1 → A2 ci-dessus — voir b1EntryLesson).
            state.lesson = b1EntryLesson(); state.step = 0; state.reviewDone = false; state.reviewLog = []; state.renfortSkipped = false;
          }
          state.lessonsPage = true;
        } else {
          // Pas validé : retour à l'accueil du contrôle (leçons à revoir + délai d'une semaine).
          state.step = 0;
        }
      }
      render();
      return;
    }
    // Examen de fin de palier : le bouton principal valide la section / passe à la suivante.
    if(state.step === 5 && examActive()){ examPrimaryAction(); return; }
    // Construction de phrase = dernière sous-étape de la Leçon (4, ou 5 avec l'encart transversal).
    if(state.step === 1 && state.subStep === LECON_SUBSTEPS-1 && sbRound < ROUNDS.length-1){
      sbRound++;
      render();
      return;
    }
    if(discoverPending()){ state.discoverSeen = state.lesson; render(); return; }
    if(state.step === 1 && state.subStep === 0 && vocabBlockIdx < vocabBlocks().length-1){
      vocabBlockIdx++;
      render();
      return;
    }
    if(state.step === 1 && state.subStep < LECON_SUBSTEPS-1){
      state.subStep++;
      if(state.subStep === 1){ vocabBlockIdx = 0; }
    } else if(state.step === 4 && state.subStep < LECTURE_SUBSTEPS-1){
      state.subStep++;
    } else if(state.step === 5 && state.quizIndex < QUIZ.length-1){
      state.quizIndex++;
    } else if(state.step === 6){
      var __lessonBefore6 = state.lesson;
      // Examen de fin de palier : réussite = décision ≠ "fail" (grille 70/80/93, voir examFinalize) ;
      // le brouillon est effacé (un nouveau passage repartira de zéro).
      var examDone = examActive() && state.examResult;
      var bilanPassed = examDone ? state.examResult.decision !== "fail" : state.quizScore >= Math.ceil(QUIZ.length * PASS_THRESHOLD_RATIO);
      if(examDone){ examClearDraft(); state.examResult = null; }
      if(ES_MODE){
        // Espagnol : chapitre suivant (X1 → X2 …) ; après le dernier (X8), retour à l'appli (Mes cours).
        // Pas réussi : on refait le même chapitre.
        if(bilanPassed){
          var esNext = nextPlayableLesson(state.lesson);
          if(esNext == null){ esGoApp(); return; }
          state.lesson = esNext; state.reviewDone = false; state.reviewLog = [];
        }
      } else if(bilanPassed && state.returnTo != null){
        // Leçon revue à la demande d'un contrôle ou d'un renfort : on y retourne.
        markRenfortDone(state.lesson);
        state.lesson = state.returnTo; state.returnTo = null; state.ctrlDraw = null;
      } else if(bilanPassed && lessonRank(state.lesson) < lessonRank(GRAND_CONTROLE_A2_LESSON)){
        state.lesson++;
        state.reviewDone = false; state.reviewLog = [];
        if(isGrandControle()){ state.gcExprScore = 0; state.gcExprLog = []; }
      } else if(bilanPassed && isBLesson(state.lesson)){
        // B1 / B2 / C1 : leçon jouable suivante dans l'ordre pédagogique (B1.0 → B1.1 ; B1.12 → B2.0 → B2.1,
        // ou B1.12 → B2.1 sans B2.0, la 39 étant réservée au futur Grand Contrôle B1 ; B2.12 → C1.0 → C1.1,
        // ou B2.12 → C1.1 sans C1.0 ; 67 réservée au futur Grand Contrôle C1). S'il n'y en a pas (fin de C1.12,
        // fin de B2.12 sans lessons-c1.js, ou fichier de la suite pas encore
        // déposé) : retour aux leçons pour réviser en attendant — même repli qu'après B1.3 jusqu'ici.
        var nextId = nextPlayableLesson(state.lesson);
        if(nextId != null){
          state.lesson = nextId; state.reviewDone = false; state.reviewLog = [];
        } else {
          state.lesson = 0; state.reviewDone = true; state.reviewLog = [];
        }
      }
      state.step = 0; state.subStep = 0; state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
      memState = null; sbRound = 0; vocabBlockIdx = 0;
      if(state.lesson !== __lessonBefore6) state.lessonsPage = true;
    } else {
      state.step = Math.min(state.step+1, 6);
      state.subStep = 0;
    }
    render();
  }
  nextBtn.addEventListener("click", ficheNextWrap(guidedWrap(goNext, 1)));

  function goBack(){
    if(state.lessonsPage){ return; }
    if(state.hub || state.pick){ state.hub = false; state.pick = false; render(); return; }
    if(ES_MODE && !isGrandControle() && state.step === 1 && state.subStep === 0 && vocabBlockIdx === 0 && !discoverPending() && esNoAntecedent()){ esGoApp(); return; }
    if(isGrandControle()){
      if(state.step === 1 && sbRound > 0){ sbRound--; render(); return; }
      if(state.step === 1 && sbRound === 0){ state.step = 0; render(); return; }
      return; // pas de retour arrière pendant le Contrôle ou depuis le Bilan (comme pour les leçons)
    }
    if(state.step === 1 && state.subStep === LECON_SUBSTEPS-1 && sbRound > 0){
      sbRound--;
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 0 && vocabBlockIdx > 0){
      vocabBlockIdx--;
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 0 && IMG && IMG.discover && state.discoverSeen === state.lesson){
      state.discoverSeen = null; render(); return;
    }
    if(state.step === 1 && state.subStep > 0){
      state.subStep--;
      if(state.subStep === 0){ vocabBlockIdx = vocabBlocks().length-1; }
    } else if(state.step === 4 && state.subStep > 0){
      state.subStep--;
    } else {
      state.step = Math.max(state.step-1, 0);
      state.subStep = 0;
      vocabBlockIdx = 0;
    }
    render();
  }
  backBtn.addEventListener("click", guidedWrap(goBack, -1));

  computeLessonTitles();
  publishTitles();
  // lessons.html#renfort=3 (depuis Mes cours › Mes renforts) : refaire la leçon 3 en entier,
  // puis revenir à la leçon en cours ; la leçon réussie est cochée « renfort fait ».
  (function(){
    var m = /renfort=(-?\d+)/.exec(location.hash || "");
    if(!m || PRACTICE || ES_MODE) return;
    var id = parseInt(m[1], 10);
    if(!quizOf(id)) return;
    try { history.replaceState(null, "", location.pathname); } catch(e){}
    state.returnTo = state.lesson; state.lesson = id; state.renfortSkipped = true;
    state.step = 0; state.subStep = 0; state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
    state.ctrlDraw = null; memState = null; sbRound = 0; vocabBlockIdx = 0;
  })();
  // Accès de test (uniquement si l'adresse contient #rootstest) — sans effet pour les utilisateurs.
  if(/rootstest/.test(location.hash || "")){
    window.__rootsTest = { state:state, render:render, goNext:goNext, quiz:function(){ return QUIZ; }, rounds:function(){ return ROUNDS; },
      label:lessonLabel, meta:function(){ return META; }, media:function(){ return MEDIA; }, lectureSubsteps:function(){ return LECTURE_SUBSTEPS; },
      leconSubsteps:function(){ return LECON_SUBSTEPS; }, transversal:function(){ return TRANSV; }, rank:lessonRank, order:LESSON_ORDER, level:levelOfLesson, practice:function(){ return PRACTICE; },
      titles:function(){ return LESSON_TITLES; }, playable:isPlayableLesson,
      exam:function(){ return EXAM; }, examActive:examActive, examResult:function(){ return state.examResult; },
      examNormalize:examNormalize, examBlankOk:examBlankOk,
      // (26/09) mode espagnol, entraînement intensif, texte légendé
      esMode:ES_MODE, lessonKey:LESSON_KEY, targetLang:targetLang, makeUtterance:makeUtterance, looksTarget:looksTarget,
      drills:function(){ return DRILLS; }, annotated:function(){ return ANNOTATED; }, drillCheck:drillCheck, drillSentence:drillSentence,
      drillsSubstep:drillsSubstep, annotatedSubstep:annotatedSubstep, drillState:function(){ return drillState; }, nextPlayable:nextPlayableLesson };
  }
  // Entrée dans une leçon normale : on arrive d'abord sur le plan (cases + choix de l'ordre).
  loadLessonData();
  if(!PRACTICE && !STANDALONE && !isGrandControle() && state.returnTo == null && !/rootstest/.test(location.hash || "") && !(ES_MODE && !isPlayableLesson(state.lesson))){
    state.lessonsPage = true;
  }
  render();

})();
</script>
