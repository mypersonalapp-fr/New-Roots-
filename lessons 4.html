<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Roots — Leçon</title>
<link rel="icon" type="image/png" href="assets/img/app-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F6F7F9;
    --ink:#1B1D22;
    --muted:#5B6068;
    --accent:#E2A13D;
    --accent-ink:#FFFFFF;
    --accent-soft:#FBEBD3;
    --pop:#E0432F;
    --pop-soft:#FBD3CE;
    --good:#1E8E4F;
    --good-soft:#CFEED9;
    --gold:#1B3C39;
    --gold-soft:#E8EEED;
    --line:#E6E8EC;
    --shadow: 0 1px 2px rgba(22,35,44,.06), 0 8px 24px -12px rgba(22,35,44,.18);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E171D; --surface:#16222A; --surface-2:#1D2C35; --ink:#E7EEF1; --muted:#93A8B2;
      --accent:#77AAD3; --accent-ink:#0E171D; --accent-soft:#1F3542; --pop:#FF8368; --pop-soft:#4A2620;
      --good:#5FD68C; --good-soft:#1D3A28;
      --gold:#E4BE6A; --gold-soft:#3A301A; --line:#2A3942;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E171D; --surface:#16222A; --surface-2:#1D2C35; --ink:#E7EEF1; --muted:#93A8B2;
    --accent:#77AAD3; --accent-ink:#0E171D; --accent-soft:#1F3542; --pop:#FF8368; --pop-soft:#4A2620;
    --good:#5FD68C; --good-soft:#1D3A28;
    --gold:#E4BE6A; --gold-soft:#3A301A; --line:#2A3942;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  /* Note : contrairement au prototype d'origine, l'identité visuelle "The
     Roots" (couleurs, fond) reste la même quelle que soit la variante
     (britannique/américaine) choisie — pas de re-thème par drapeau, pour
     rester cohérent avec le reste de l'application. */

  *{box-sizing:border-box;}
  /* Même fond que le reste de l'application (globe/drapeaux en haut,
     villes en bas), fixe derrière tout, jamais coupé : une copie floutée
     comble les bords, une copie nette et entière reste centrée dessus. */
  body::before, body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background-image:url('assets/img/shell-bg.jpg');
    background-repeat:no-repeat; background-position:center;
  }
  body::before{
    background-size:cover;
    filter:blur(46px) saturate(1.15) brightness(0.97);
    transform:scale(1.18);
  }
  body::after{ background-size:contain; }
  html{ background:var(--bg); }
  body{
    margin:0;
    background:transparent;
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    padding-inline:16px;
    padding-block:32px;
    min-height:100vh;
    position:relative;
    isolation:isolate;
  }
  h1,h2,h3{ font-family:"Sora", ui-sans-serif, sans-serif; text-wrap:balance; margin:0; line-height:1.15; font-weight:700; }
  .wrap{ max-width:640px; margin-inline:auto; display:flex; flex-direction:column; gap:18px; }

  .masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{ font-family:"Sora", sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:-0.01em; }
  .brand .tagline{ font-weight:600; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .route-chip{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 14px 6px 8px; box-shadow:var(--shadow); font-weight:600; font-size:.78rem; letter-spacing:.01em; color:var(--muted); }
  .route-chip .flags{ font-size:1rem; line-height:1; }
  .route-chip b{ color:var(--ink); font-weight:600; }

  .itinerary{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .itinerary[hidden]{ display:none; }
  .leg{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .leg .dot{ width:100%; height:5px; border-radius:3px; background:var(--line); }
  .leg.done .dot{ background:var(--accent); }
  .leg.active .dot{ background:var(--pop); }
  .leg .label{ font-weight:600; font-size:.56rem; max-width:100%; overflow:hidden; text-overflow:clip; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); text-align:center; }
  .leg.active .label{ color:var(--pop); font-weight:600; }
  .leg.done .label{ color:var(--accent); }

  /* Encadré transparent (verre dépoli), pour rester cohérent avec le
     reste de l'application : plus de pavé blanc plein derrière la leçon,
     le décor se devine flouté derrière, le texte garde un léger halo pour
     rester lisible. */
  .card{
    position:relative;
    background: rgba(255,255,255,0.40);
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius:var(--radius);
    box-shadow: 0 8px 20px rgba(20,20,30,0.07), 0 1px 0 rgba(255,255,255,0.6) inset;
    padding:28px 24px 24px;
    overflow:hidden;
    color: var(--ink);
    text-shadow: 0 1px 2px rgba(255,255,255,.4);
  }
  .postmark{ position:absolute; top:16px; right:16px; width:52px; height:52px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.56rem; color:var(--muted); text-align:center; line-height:1.15; transform:rotate(-8deg); flex-direction:column; opacity:.8; }
  .eyebrow{ font-weight:700; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .screen-title{ font-size:1.55rem; max-width:80%; }
  .lede{ color:var(--muted); margin-top:8px; font-size:.91rem; max-width:52ch; }
  .step-count{ font-weight:600; font-size:.68rem; color:var(--muted); margin-top:2px; }

  .vocab-list{ display:flex; flex-direction:column; gap:8px; }
  .vocab-block-title{ font-family:"Sora", sans-serif; font-weight:700; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); margin:14px 0 2px; }
  .vocab-block-title:first-child{ margin-top:0; }
  .vocab-block-heading{ font-family:"Sora", sans-serif; font-weight:700; font-size:.82rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); margin-top:10px; }
  .vocab-dots{ display:flex; gap:6px; margin-top:8px; }
  .vocab-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .vocab-dot.active{ background:var(--accent); width:18px; border-radius:4px; }
  .vocab-row{ background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .vocab-main{ display:flex; align-items:center; gap:10px; }
  .vocab-row .say{ flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease, background .12s ease; }
  .vocab-row .say:hover{ background:var(--accent-soft); }
  .vocab-row .say:active{ transform:scale(.92); }
  .vocab-row .words{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .vocab-row .en{ font-weight:700; font-size:1rem; }
  .vocab-row .ipa{ font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--muted); }
  .vocab-row .fr{ font-weight:600; font-size:.82rem; color:var(--accent); flex:0 0 auto; }
  .note-toggle{ flex:0 0 auto; background:none; border:none; color:var(--gold); font-size:.95rem; cursor:pointer; padding:4px; }
  .vocab-row .vis{ flex:0 0 auto; width:44px; height:44px; border-radius:12px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.6rem; line-height:1; color:var(--accent); }
  .vocab-row .vis-txt{ font-size:.78rem; font-weight:800; letter-spacing:.02em; }
  .vocab-row .vis-clock{ color:var(--ink); }
  .vocab-main.has-vis{ display:grid; grid-template-columns:44px minmax(0,1fr) auto auto; grid-template-areas:"vis words say bulb" "vis fr say bulb"; column-gap:10px; row-gap:0; align-items:center; }
  .vocab-main.has-vis .vis{ grid-area:vis; }
  .vocab-main.has-vis .words{ grid-area:words; align-self:end; }
  .vocab-main.has-vis .fr{ grid-area:fr; align-self:start; max-width:none; text-align:left; font-size:.82rem; }
  .vocab-main.has-vis .say{ grid-area:say; }
  .vocab-main.has-vis .note-toggle{ grid-area:bulb; }
  .vocab-ex{ display:flex; align-items:flex-start; gap:8px; margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--accent-soft); font-size:.86rem; }
  .vocab-ex .ex-say{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:.75rem; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .vocab-ex .ex-body{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .vocab-ex .ex-t{ font-weight:700; }
  .vocab-ex .ex-f{ color:var(--muted); font-size:.78rem; }
  .note-panel{ font-size:.82rem; color:var(--ink); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .note-panel b{ color:var(--gold); }

  .culture-note-card{ margin-top:16px; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius:14px; padding:13px 15px; }
  .culture-note-head{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.86rem; color:var(--accent); }
  .culture-note-icon{ font-size:1.05rem; }
  .culture-note-text{ font-size:.83rem; color:var(--ink); margin-top:7px; line-height:1.5; }
  .culture-note-text b{ color:var(--accent); }

  .why{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .why-toggle{ align-self:flex-start; display:flex; align-items:center; gap:6px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); color:var(--gold); font-family:"Manrope", sans-serif; font-weight:600; font-size:.82rem; border-radius:999px; padding:7px 14px; cursor:pointer; }
  .why-toggle .chev{ transition:transform .15s ease; font-size:.7rem; }
  .why-toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .why-panel{ background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:12px; padding:11px 14px; font-size:.86rem; }
  .why-panel b{ color:var(--gold); }
  .why-inline{ display:flex; gap:9px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:12px; padding:11px 14px; margin-top:12px; font-size:.85rem; }
  .why-inline .icon{ flex:0 0 auto; }

  .bank{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; min-height:44px; }
  .chip-btn{ font-family:"Manrope", sans-serif; font-weight:700; font-size:.92rem; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:8px 14px; cursor:pointer; }
  .chip-btn:hover{ border-color:var(--accent); }
  .chip-btn:disabled{ opacity:.35; cursor:default; }
  .answer-row{ display:flex; flex-wrap:wrap; gap:8px; min-height:46px; border:1px dashed var(--line); border-radius:10px; padding:8px; margin-top:10px; }
  .answer-row .chip-btn{ background:var(--accent-soft); border-color:var(--accent); }
  .round-tag{ font-weight:700; font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  .conj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .conj-item{ background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:.86rem; color:var(--muted); }
  .conj-item b{ font-family:"Sora", sans-serif; font-weight:700; font-size:.94rem; display:block; color:var(--ink); margin-bottom:2px; }
  .conj-item .ctr{ color:var(--accent); }
  @media (max-width:480px){ .conj-grid{ grid-template-columns:1fr; } }

  .dialogue{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .bubble-row{ display:flex; gap:8px; align-items:flex-end; }
  .bubble-row.you{ flex-direction:row-reverse; }
  .avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.82rem; font-weight:700; flex:0 0 auto; }
  .bubble-row.you .avatar{ background:var(--gold-soft); color:var(--gold); }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:16px; background:var(--surface-2); border-bottom-left-radius:4px; }
  .bubble-row.you .bubble{ background:var(--accent-soft); border-bottom-left-radius:16px; border-bottom-right-radius:4px; }
  .bubble .en{ font-weight:700; font-size:.92rem; display:block; }
  .bubble .fr{ font-size:.74rem; color:var(--muted); display:block; margin-top:3px; }

  .mini-check{ background:var(--surface-2); border-radius:12px; padding:14px; margin-top:12px; }
  .mini-q{ font-weight:700; font-size:.94rem; margin-bottom:8px; }
  .mini-opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .mini-opt{ font-family:"Manrope", sans-serif; font-weight:600; font-size:.86rem; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 12px; cursor:pointer; }
  .mini-opt.correct{ background:var(--good-soft); border:2px solid var(--good); color:var(--ink); font-weight:700; }
  .mini-opt.incorrect{ background:var(--pop-soft); border:2px solid var(--pop); color:var(--ink); text-decoration:line-through; text-decoration-color:var(--pop); }
  .mini-opt .opt-icon{ font-weight:800; }
  .mini-opt.correct .opt-icon{ color:var(--good); }
  .mini-opt.incorrect .opt-icon{ color:var(--pop); }
  .mini-opt:disabled{ cursor:default; }
  .mini-fb{ font-size:.78rem; color:var(--muted); margin-top:6px; }

  .memgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .mcard{ aspect-ratio:1/.82; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; font-size:.84rem; font-weight:700; cursor:pointer; user-select:none; transition:background .15s ease, border-color .15s ease, transform .1s ease; }
  .mcard .face{ display:none; }
  .mcard.flipped .face{ display:block; }
  .mcard.flipped .back{ display:none; }
  .mcard .back{ font-family:"Sora", sans-serif; font-size:1.3rem; color:var(--muted); }
  .mcard.matched{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); cursor:default; }
  .mcard:active{ transform:scale(.97); }
  .game-stats{ display:flex; gap:16px; margin-top:12px; font-family:"IBM Plex Mono", monospace; font-size:.78rem; color:var(--muted); }
  .game-stats b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .q-progress{ font-family:"IBM Plex Mono", monospace; font-size:.72rem; color:var(--muted); letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .q-cat{ display:inline-flex; align-items:center; gap:4px; font-family:"Manrope",sans-serif; font-weight:700; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:999px; }
  .q-cat.oral{ background:var(--accent-soft); color:var(--accent); }
  .q-cat.ecrit{ background:var(--gold-soft); color:var(--gold); }
  .q-cat.comprehension{ background:var(--pop-soft); color:var(--pop); }
  .q-audio{ display:flex; align-items:center; gap:10px; margin-top:10px; background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .q-audio-btn{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent); font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .q-audio-btn:hover{ background:var(--accent-soft); }
  .q-audio-hint{ font-size:.8rem; color:var(--muted); font-weight:600; }
  .q-passage{ background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 12px 12px 0; padding:12px 14px; margin-top:8px; font-size:.92rem; line-height:1.5; }
  .gloss-box{ background:var(--gold-soft); border-radius:12px; padding:10px 12px; margin:10px 0 14px; }
  .gloss-title{ font-weight:700; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); margin-bottom:6px; }
  .gloss-item{ font-size:.86rem; margin-top:3px; }
  .gloss-item b{ color:var(--ink); }
  .newword{ color:var(--pop); font-weight:700; text-decoration:underline; text-decoration-color:var(--pop-soft); text-underline-offset:3px; }
  .gloss-word{ border-bottom:2px dotted var(--accent); cursor:pointer; position:relative; }
  .gloss-word.active{ background:var(--accent-soft); border-radius:3px; }
  .gloss-word.active::after{
    content:attr(data-fr);
    position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:.72rem; font-weight:700;
    padding:5px 9px; border-radius:7px; white-space:nowrap; margin-bottom:6px;
    box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:5;
  }
  .q-text{ font-size:1.1rem; font-weight:700; margin-top:6px; }
  .options{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .opt{ text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:.94rem; font-family:inherit; color:var(--ink); cursor:pointer; }
  .opt:hover{ border-color:var(--accent); }
  .opt.correct{ background:var(--good-soft); border:2px solid var(--good); color:var(--ink); font-weight:700; }
  .opt.incorrect{ background:var(--pop-soft); border:2px solid var(--pop); color:var(--ink); text-decoration:line-through; text-decoration-color:var(--pop); }
  .opt .opt-icon{ font-weight:800; }
  .opt.correct .opt-icon{ color:var(--good); }
  .opt.incorrect .opt-icon{ color:var(--pop); }
  .opt:disabled{ cursor:default; }

  .score-band{ display:flex; align-items:baseline; gap:10px; margin:10px 0 4px; }
  .score-band .big{ font-family:"Sora", sans-serif; font-weight:800; font-size:3rem; color:var(--accent); font-variant-numeric:tabular-nums; }
  .score-band .of{ font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:1rem; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .stat{ background:var(--surface-2); border-radius:12px; padding:12px; text-align:center; }
  .stat .n{ font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:1.15rem; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .recap{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .recap-item{ display:flex; gap:10px; font-size:.86rem; align-items:flex-start; }
  .recap-item .tick{ flex:0 0 auto; }
  .recap-item.miss .tick{ color:var(--pop); font-weight:800; }
  .recap-item.hit .tick{ color:var(--good); font-weight:800; }
  .bilan-retry{ margin-top:16px; padding:12px 14px; background:var(--pop-soft); border:2px solid var(--pop); border-radius:12px; font-size:.86rem; line-height:1.4; }
  .gc-recap-toggle{ margin-top:16px; }
  .gc-recap-toggle summary{ cursor:pointer; color:var(--accent); font-weight:700; font-size:.86rem; list-style:none; padding:4px 0; }
  .gc-recap-toggle summary::-webkit-details-marker{ display:none; }
  .gc-recap-toggle summary::before{ content:"▸ "; }
  .gc-recap-toggle[open] summary::before{ content:"▾ "; }
  .gc-recap-toggle .recap{ margin-top:12px; }

  .controls{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .btn{ font-family:"Manrope", sans-serif; font-weight:700; font-size:.96rem; border-radius:12px; padding:12px 22px; border:1px solid transparent; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); margin-left:auto; }
  .btn-primary:disabled{ opacity:.4; cursor:default; }
  .btn-ghost{ background:transparent; color:var(--muted); border-color:var(--line); }
  .btn:focus-visible, .chip-btn:focus-visible, .opt:focus-visible, .mcard:focus-visible, .say:focus-visible, .why-toggle:focus-visible, .mini-opt:focus-visible, .note-toggle:focus-visible{ outline:2px solid var(--pop); outline-offset:2px; }
  .hint{ font-weight:600; font-size:.72rem; color:var(--muted); text-align:center; }

    QUIZ.forEach(function(q, i){ var k = q.cat === "oral" ? "co" : (q.cat === "comprehension" ? "ce" : "gv"); sk[k][1]++; if(state.quizLog[i]) sk[k][0]++; else addMiss(k, q._lesson); });

      ids = mode.split(",").map(function(x){ return parseInt(x, 10); }).filter(function(x){ return !isNaN(x) && quizOf(x); });
    }
    var pool = [];
    ids.forEach(function(id){ (quizOf(id) || []).forEach(function(q){ pool.push(Object.assign({}, q, { _lesson:id })); }); });
    PRACTICE.ids = ids; PRACTICE.quiz = shuffleArr(pool).slice(0, 8); PRACTICE.built = true;
  }
  function renderPractice(){
    if(!PRACTICE.built) buildPractice();
    itinerary.hidden = true; backBtn.style.visibility = "hidden";
    postmark.innerHTML = "MISSION<br>5 MIN";
    var P = PRACTICE, Q = P.quiz[P.idx];
    if(!P.quiz.length){
      screen.innerHTML = '<div class="eyebrow">Mission du jour</div><h2 class="screen-title">Rien à retravailler aujourd\'hui 🎉</h2><p class="lede">Aucune erreur en attente : continue tes leçons, ou reviens demain.</p>';
      nextBtn.style.display = ""; nextBtn.textContent = "Retour à l'appli"; hint.textContent = "";

    }
    if(P.idx >= P.quiz.length){ return renderPracticeEnd(); }
    var cat = Q.cat || "ecrit";
    screen.innerHTML =
      '<div class="eyebrow">'+(P.mode === "auto" ? "Mission de récupération" : "Entraînement express")+' · '+lessonTitle(Q._lesson)+'</div>' +
      '<div class="q-progress"><span>Question '+(P.idx+1)+' / '+P.quiz.length+'</span><span class="q-cat '+cat+'">'+Q_CAT_LABEL[cat]+'</span></div>' +
      '<div class="q-text">'+Q.q+'</div>' +
      (Q.passage ? '<div class="q-passage">'+Q.passage+'</div>' : "") +
      (Q.audio ? '<div class="q-audio"><button class="q-audio-btn" id="qAudioBtn" aria-label="Écouter">🔊</button><span class="q-audio-hint">Écoute avant de répondre.</span></div>' : "") +
      '<div class="options" id="opts"></div><div id="qWhyWrap"></div>';
    if(Q.audio) document.getElementById("qAudioBtn").addEventListener("click", function(){ speak(Q.audio); });
    nextBtn.style.display = "none"; hint.textContent = "";
    var opts = document.getElementById("opts"), attempts = 0, resolved = false;
    Q.opts.forEach(function(opt, i){
      var b = document.createElement("button");
      b.className = "opt"; b.textContent = opt;
      b.addEventListener("click", function(){
        if(resolved || b.disabled) return;
        if(looksTarget(opt)) speak(opt);
        attempts++;
        if(i === Q.correct){
          markOption(b, "correct"); resolved = true;
          Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
          var first = attempts === 1; P.log[P.idx] = first; if(first) P.score++;
          recordSkill(skillOfQ(Q), first);
          setTimeout(function(){ P.idx++; renderPractice(); }, 650);
        } else if(attempts >= 2){
          markOption(b, "incorrect"); markOption(opts.children[Q.correct], "correct"); resolved = true;
          Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
          P.log[P.idx] = false; recordSkill(skillOfQ(Q), false);
          document.getElementById("qWhyWrap").innerHTML = '<div class="why-inline"><span class="icon">💡</span><div>'+Q.why+'</div></div><button class="btn btn-primary" id="qContinue" style="margin-top:12px">Suivant</button>';
          document.getElementById("qContinue").addEventListener("click", function(){ P.idx++; renderPractice(); });
        } else { markOption(b, "incorrect"); b.disabled = true; }
      });
      opts.appendChild(b);
    });
  }
  function renderPracticeEnd(){
    var P = PRACTICE;
    if(!P.saved){
      P.saved = true;
      // Missions : une leçon réussie sans faute passe à l'étape suivante (demain → dans 7 jours →
      // acquise) ; sinon elle revient demain.
      var all = lsGet(K_ERR, {}), m = all[LANG] || {};
      P.ids.forEach(function(id){
        var qs = []; P.quiz.forEach(function(q, i){ if(q._lesson === id) qs.push(P.log[i]); });
        if(!qs.length || !m[id]) return;
        var clean = qs.every(function(x){ return x; });
        if(clean){ m[id].stage = (m[id].stage || 0) + 1; m[id].due = Date.now() + (m[id].stage === 1 ? 1 : 7) * DAY_MS; if(m[id].stage >= 3) delete m[id]; }
        else { m[id].stage = 0; m[id].due = Date.now() + DAY_MS; }
      });
      all[LANG] = m; lsSet(K_ERR, all);
    }
    screen.innerHTML = '<div class="eyebrow">Mission terminée</div><h2 class="screen-title">'+P.score+' / '+P.quiz.length+' du premier coup</h2>' +

  var cachedVoices = [];
  function loadVoices(){ try{ cachedVoices = window.speechSynthesis.getVoices(); }catch(e){} }

  // Voix préférée choisie dans Paramètres > Réglages généraux > Voix (app
  // principale) : gardée sous forme "nom|langue" dans le store partagé
  // (localStorage "the_roots_store_v1"), relue ici pour que lessons.html
  // utilise la même voix plutôt que de toujours forcer l'accent britannique.
  function preferredVoiceKey(){
    try{
      var raw = localStorage.getItem("the_roots_store_v1");
      if(!raw) return null;
      var data = JSON.parse(raw);
      return (data && data.settings && data.settings.preferredVoiceURI) || null;
    }catch(e){ return null; }
  }
  // Langue de la voix / du micro : anglais britannique ou américain (selon la version choisie), ou en
  // mode espagnol es-ES (Espagne, défaut) / es-CO (Colombie).
  function targetLang(){
    if(ES_MODE) return state.variant === "co" ? "es-CO" : "es-ES";
    return state.variant === "us" ? "en-US" : "en-GB";
  }
  // Mode espagnol : voix à essayer, dans l'ordre. Espagne → es-ES ; Colombie → es-CO, puis les
  // accents d'Amérique les plus proches (es-MX, es-US, es-419), puis es-ES ; en dernier recours
  // n'importe quelle voix espagnole. La voix choisie dans Paramètres n'est reprise que si elle est
  // espagnole (c'est en général une voix anglaise).
  var ES_VOICE_ORDER = { es:["es-ES"], co:["es-CO","es-MX","es-US","es-419","es-ES"] };
  function pickEsVoice(){
    var norm = function(l){ return String(l || "").replace("_", "-"); };
    var key = preferredVoiceKey();
    if(key){
      var parts = key.split("|");
      var pv = cachedVoices.find(function(v){ return v.name === parts[0] && v.lang === parts[1]; });
      if(pv && norm(pv.lang).toLowerCase().indexOf("es") === 0) return pv;
    }
    var order = ES_VOICE_ORDER[state.variant === "co" ? "co" : "es"];
    for(var i = 0; i < order.length; i++){
      var want = order[i].toLowerCase();
      var v = cachedVoices.find(function(x){ return norm(x.lang).toLowerCase() === want; }) ||
              cachedVoices.find(function(x){ return norm(x.lang).toLowerCase().indexOf(want) === 0; });
      if(v) return v;
    }
    return cachedVoices.find(function(x){ return norm(x.lang).toLowerCase().indexOf("es") === 0; }) || null;
  }
  // Phrase prête à être lue (voix + accent), utilisée par speak() et par l'écoute des examens.
  function makeUtterance(text){
      var u = new SpeechSynthesisUtterance(text);
      if(ES_MODE){
        // Espagnol : voix de la variante (voir pickEsVoice) ; sans voix trouvée, on demande quand
        // même la bonne langue au téléphone.
        var esVoice = pickEsVoice();
        u.lang = targetLang();
        if(esVoice){ u.voice = esVoice; u.lang = String(esVoice.lang).replace("_", "-"); }
        u.rate = 0.92;
        return u;
      }
      // Bug corrigé : cette fonction (utilisée pour QUASI tout l'audio de la
      // leçon — vocabulaire, quiz, exemples...) forçait toujours l'accent
      // britannique "en-GB", même quand l'apprenant suit le cours en anglais
      // AMÉRICAIN (state.variant === "us") — seul le bouton "Tout écouter"
      // (readAllBtn, plus bas) tenait compte du variant choisi. Les deux
      // utilisent maintenant exactement la même logique : la voix choisie
      // dans Paramètres si elle existe, sinon l'accent du variant suivi.
      var variantLang = state.variant === "us" ? "en-US" : "en-GB";
      u.lang = variantLang;
      var chosen = null;
      var key = preferredVoiceKey();
      if(key){
        var parts = key.split("|");
        var name = parts[0], voiceLang = parts[1];
        chosen = cachedVoices.find(function(v){ return v.name === name && v.lang === voiceLang; });
      }
      if(!chosen){
        chosen = cachedVoices.find(function(v){ return v.lang === variantLang; }) ||
                 cachedVoices.find(function(v){ return (v.lang||"").indexOf(variantLang) === 0; });
      }
      if(chosen){ u.voice = chosen; u.lang = chosen.lang; }
      u.rate = 0.92;
      return u;
  }
  function speak(text){
    try{
      if(!window.speechSynthesis) return;
      var u = makeUtterance(text);
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function langWords(s){ return String(s == null ? "" : s).toLowerCase().replace(/<[^>]*>/g, " ").match(/[a-zà-ÿ]+/g) || []; }
  function buildEsWordSets(){
    ES_WORDS = {}; FR_WORDS = {};
    var addEs = function(t){ langWords(t).forEach(function(w){ ES_WORDS[w] = true; }); };

  function looksSpanish(s){

    if(/[áíóú]/i.test(s)) return true;                       // accents aigus sur a/i/o/u : espagnol
    if(!ES_WORDS) buildEsWordSets();
    var w = langWords(s);
    if(!w.length) return false;

    var esOnly = w.some(function(x){ return ES_WORDS[x] && !FR_WORDS[x]; });

  var drillsCache = { raw:null, ok:null };
  function validDrills(D){
    if(!Array.isArray(D)) return null;
    if(drillsCache.raw === D) return drillsCache.ok;
    drillsCache.raw = D;
    var ok = D.filter(function(d){
      if(!d) return false;
      if(d.type === "fill") return typeof d.text === "string" && d.text.indexOf("___") >= 0 && Array.isArray(d.answers) && d.answers.length > 0;
      if(d.type === "choice") return d.q && Array.isArray(d.opts) && d.opts.length > 1 && d.correct >= 0 && d.correct < d.opts.length;
      return false;
    });
    drillsCache.ok = ok.length ? ok : null;
    return drillsCache.ok;
  }
  var FOLD_MAP = { "á":"a","à":"a","â":"a","ä":"a","é":"e","è":"e","ê":"e","ë":"e","í":"i","ì":"i","î":"i","ï":"i",
    "ó":"o","ò":"o","ô":"o","ö":"o","ú":"u","ù":"u","û":"u","ü":"u","ñ":"n","ç":"c" };
  // Sans les accents (á → a, ñ → n, ü → u…), sur un texte déjà en minuscules.
  function drillFold(s){ return String(s).replace(/[áàâäéèêëíìîïóòôöúùûüñç]/g, function(c){ return FOLD_MAP[c]; }); }
  // Comparaison souple : casse, espaces, apostrophes, ¿ ¡ et ponctuation de début / fin ignorés.
  function drillNorm(s){
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[’‘`´]/g, "'")
      .replace(/[¿¡]/g, " ")
      .replace(/\s+/g, " ").trim()
      .replace(/^["«“\s]+/, "")
      .replace(/[\s.!?…,;:"»”]+$/, "")
      .replace(/\s+([,;:])/g, "$1");
  }
  // "ok" (juste), "accent" (juste en ignorant les accents) ou "ko".
  function drillCheck(input, answers){
    var n = drillNorm(input);
    if(!n) return "ko";
    var list = answers.map(drillNorm);
    if(list.indexOf(n) >= 0) return "ok";
    var f = drillFold(n);
    return list.some(function(a){ return drillFold(a) === f; }) ? "accent" : "ko";
  }
  // Phrase complète à écouter : trou rempli, indications entre parenthèses retirées, et pour une
  // consigne « Traduis « … » → ___ », seulement la partie après la flèche.
  function drillSentence(D){
    var t = D.text.replace("___", D.answers[0]);
    if(t.indexOf("→") >= 0) t = t.slice(t.lastIndexOf("→") + 1);
    return t.replace(/\s*\([^)]*\)/g, "").replace(/\s+/g, " ").replace(/\s+([.,!?;:])/g, "$1").trim();
  }
  function drillEsc(s){ return escAttr(s).replace(/>/g, "&gt;"); }
  function drillsSubstep(){ return 4 + (TRANSV ? 1 : 0); }
  var drillState = null;
  // Nouvelle série : tous les exercices (retry = false), ou seulement les ratés (retry = true, on garde
  // le score du premier passage).
  function drillReset(order, retry){
    var prev = retry ? drillState : null;
    drillState = { lesson:state.lesson, src:DRILLS, order:order, pos:0, round:prev ? prev.round + 1 : 1,
      first:prev ? prev.first : {}, last:prev ? prev.last : {}, answered:null, done:false };
  }
  var DRILL_ACCENTS = ["á","é","í","ó","ú","ñ","ü","¿","¡"];
  function renderDrills(){
    if(!drillState || drillState.src !== DRILLS || drillState.lesson !== state.lesson) drillReset(DRILLS.map(function(_, i){ return i; }), false);
    var S = drillState;
    backBtn.style.visibility = "visible";
    postmark.innerHTML = "ENTRAÎ-<br>NEMENT";
    hint.textContent = "";
    var eyebrow = '<div class="eyebrow">'+lessonLabel()+' · Entraînement intensif · '+(drillsSubstep()+1)+'/'+LECON_SUBSTEPS+'</div>';
    if(S.done) return renderDrillsEnd(eyebrow);
    nextBtn.style.display = "none";
    var idx = S.order[S.pos], D = DRILLS[idx], total = S.order.length;
    var head = eyebrow +
      '<div class="drill-top"><span class="drill-count" id="drillCount">'+(S.round > 1 ? "Ratés · " : "")+(S.pos+1)+'/'+total+'</span>' +
        '<span class="q-cat '+(D.type === "fill" ? 'ecrit">✍️ À taper' : 'oral">☝️ À choisir')+'</span></div>' +
      '<div class="drill-bar" aria-hidden="true"><div style="width:'+Math.round(S.pos / total * 100)+'%"></div></div>';
    if(D.type === "fill"){
      screen.innerHTML = head + '<div class="drill-card">' +
        '<h2 class="screen-title">Complète</h2>' +
        '<div class="drill-text">'+drillEsc(D.text).replace("___", '<span class="drill-blank" aria-label="trou à compléter">&nbsp;</span>')+'</div>' +
        '<input class="drill-input" id="drillInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Ta réponse" placeholder="Ta réponse">' +
        '<div class="drill-accents" role="group" aria-label="Lettres espagnoles">' + DRILL_ACCENTS.map(function(c){ return '<button type="button" class="drill-acc" data-ch="'+c+'" aria-label="Insérer '+c+'">'+c+'</button>'; }).join("") + '</div>' +
        '<div class="drill-actions"><button type="button" class="btn btn-primary" id="drillValidate">Valider</button></div>' +
        '<div id="drillFb"></div></div>';
      var input = document.getElementById("drillInput");
      Array.prototype.forEach.call(screen.querySelectorAll(".drill-acc"), function(b){
        var insert = function(){
          if(input.disabled) return;
          var ch = b.getAttribute("data-ch"), a = input.selectionStart, z = input.selectionEnd;
          if(a == null){ a = z = input.value.length; }
          input.value = input.value.slice(0, a) + ch + input.value.slice(z);
          try { input.focus(); input.setSelectionRange(a + ch.length, a + ch.length); } catch(e){}
        };
        // pointerdown + preventDefault : le champ garde le focus (le clavier de l'iPhone reste ouvert).
        b.addEventListener("pointerdown", function(e){ e.preventDefault(); insert(); });
        b.addEventListener("click", function(e){ if(e.detail === 0) insert(); }); // clavier (Entrée / Espace)
      });
      var validate = function(){
        if(S.answered) return;
        var res = drillCheck(input.value, D.answers);
        S.answered = res;
        var ok = res !== "ko";
        if(S.round === 1) S.first[idx] = ok;
        S.last[idx] = ok;
        input.disabled = true;
        input.classList.add(res === "ok" ? "ok" : (res === "accent" ? "warn" : "ko"));
        var good = drillEsc(D.answers[0]);
        document.getElementById("drillFb").innerHTML =
          '<div class="drill-fb '+(res === "ok" ? "ok" : (res === "accent" ? "warn" : "ko"))+'" role="status">' +
            '<div class="drill-fb-head">'+(res === "ok" ? "✓ Correct !" : (res === "accent" ? "✓ Juste ! Attention aux accents : <b>"+good+"</b>" : "✕ La bonne réponse : <b>"+good+"</b>"))+'</div>' +
            (D.why ? '<div class="drill-fb-why">💡 '+tvHtml(D.why)+'</div>' : "") +
            '<button type="button" class="drill-say" data-say="'+escAttr(drillSentence(D))+'">🔊 Écouter la phrase</button>' +
          '</div>';
        var v = document.getElementById("drillValidate");
        v.textContent = S.pos < total - 1 ? "Suivant" : "Voir mon score";
        v.focus();
      };
      document.getElementById("drillValidate").addEventListener("click", function(){ if(S.answered) drillNext(); else validate(); });
      input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); if(!S.answered) validate(); } });
      try { input.focus({ preventScroll:true }); } catch(e){}
    } else {
      screen.innerHTML = head + '<div class="drill-card">' +
        '<div class="drill-text" style="margin-top:0">'+tvHtml(D.q)+'</div>' +
        '<div class="options" id="drillOpts"></div>' +
        '<div id="drillFb"></div></div>';
      var opts = document.getElementById("drillOpts");
      D.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.textContent = opt;
        b.addEventListener("click", function(){
          if(S.answered) return;
          if(looksTarget(opt)) speak(opt);
          var ok = oi === D.correct;
          S.answered = ok ? "ok" : "ko";
          if(S.round === 1) S.first[idx] = ok;
          S.last[idx] = ok;
          Array.prototype.forEach.call(opts.children, function(o, k){
            o.disabled = true;
            if(k === D.correct) markOption(o, "correct"); else if(k === oi) markOption(o, "incorrect");
          });
          document.getElementById("drillFb").innerHTML =
            '<div class="drill-fb '+(ok ? "ok" : "ko")+'" role="status"><div class="drill-fb-head">'+(ok ? "✓ Bien vu !" : "✕ La bonne réponse : <b>"+drillEsc(D.opts[D.correct])+"</b>")+'</div>' +
            (D.why ? '<div class="drill-fb-why">💡 '+tvHtml(D.why)+'</div>' : "") + '</div>' +
            '<div class="drill-actions"><button type="button" class="btn btn-primary" id="drillValidate">'+(S.pos < total - 1 ? "Suivant" : "Voir mon score")+'</button></div>';
          document.getElementById("drillValidate").addEventListener("click", drillNext);
        });
        opts.appendChild(b);
      });
    }
  }
  function drillNext(){
    var S = drillState;
    S.answered = null;
    if(S.pos < S.order.length - 1) S.pos++; else S.done = true;
    render();
    window.scrollTo(0, 0);
  }
  function renderDrillsEnd(eyebrow){
    var S = drillState, n = DRILLS.length, firstOk = 0, missed = [];
    DRILLS.forEach(function(_, i){ if(S.first[i]) firstOk++; if(!S.last[i]) missed.push(i); });
    var retryHtml = "";
    if(S.round > 1){
      var redone = S.order.filter(function(i){ return S.last[i]; }).length;
      retryHtml = '<p class="lede"><b>Exercices ratés refaits :</b> '+redone+'/'+S.order.length+' justes cette fois.</p>';
    }
    screen.innerHTML = eyebrow +
      '<h2 class="screen-title">'+(missed.length ? "Entraînement terminé" : "Entraînement terminé 🎉")+'</h2>' +
      '<div class="drill-score">'+firstOk+'<small> / '+n+' du premier coup</small></div>' +
      retryHtml +
      (missed.length
        ? '<p class="lede">Encore '+missed.length+' exercice'+(missed.length > 1 ? "s" : "")+' à retravailler. Tu peux les refaire tout de suite (c\'est de l\'entraînement : rien ne compte dans ta note).</p>'
        : '<p class="lede">Tout est juste. Rien ne compte dans ta note : c\'était pour t\'entraîner.</p>') +
      '<div class="drill-actions">' +
        (missed.length ? '<button type="button" class="btn btn-primary" id="drillRetry">↺ Refaire les '+missed.length+' ratés</button>' : "") +
        '<button type="button" class="btn btn-ghost" id="drillRestart">Tout recommencer</button>' +
      '</div>';
    var r = document.getElementById("drillRetry");
    if(r) r.addEventListener("click", function(){ drillReset(missed, true); render(); window.scrollTo(0, 0); });
    document.getElementById("drillRestart").addEventListener("click", function(){ drillState = null; render(); window.scrollTo(0, 0); });
    nextBtn.style.display = "";
    nextBtn.textContent = "Construire une phrase";
  }

  // ---------- Texte légendé (ANNOTATED) — 26/09 ----------
  // Données : ANNOTATED = { title, intro, sentences:[ { fr, es?, tokens:[ { w, tag, info?, fr, tip? } ] } ],
  // questions:[ { q, opts, correct, why } ] }. Chaque mot est une pastille colorée selon sa nature ;
  // le toucher ouvre un encart sous la phrase (nature, genre/nombre ou infinitif·temps·personne,
  // traduction, astuce). Questions = entraînement non noté.
  var annCache = { raw:null, ok:null };
  function validAnnotated(A){
    if(!A || !Array.isArray(A.sentences)) return null;
    if(annCache.raw === A) return annCache.ok;
    annCache.raw = A;
    var sents = A.sentences.filter(function(s2){ return s2 && Array.isArray(s2.tokens) && s2.tokens.some(function(t){ return t && t.w; }); });
    if(!sents.length){ annCache.ok = null; return null; }
    var qs = (A.questions || []).filter(function(q){ return q && q.q && Array.isArray(q.opts) && q.opts.length > 1 && q.correct >= 0 && q.correct < q.opts.length; });
    annCache.ok = { title:A.title || "Texte légendé", intro:A.intro || "", sentences:sents, questions:qs };
    return annCache.ok;
  }
  function annotatedSubstep(){ return 1 + (MEDIA ? 1 : 0); }
  // Famille de couleur d'une nature de mot (les pronoms ensemble, les verbes ensemble…).
  var TAG_FAMILY = { "nom":"nom", "nom propre":"nom", "article":"det", "déterminant":"det", "adjectif":"adj",
    "pronom":"pro", "pronom sujet":"pro", "pronom réfléchi":"pro", "pronom cod":"pro", "pronom coi":"pro", "pronom tonique":"pro", "pronom relatif":"pro",
    "verbe":"verbe", "verbe pronominal":"verbe", "auxiliaire":"verbe", "préposition":"lien", "conjonction":"lien", "adverbe":"adv", "interjection":"autre" };
  var TAG_LEGEND = [["nom","Nom"],["det","Article · déterminant"],["adj","Adjectif"],["pro","Pronom"],["verbe","Verbe"],["adv","Adverbe"],["lien","Préposition · conjonction"],["autre","Autre"]];
  function tagFamily(tag){ var t = String(tag || "").toLowerCase().trim(); return TAG_FAMILY[t] || (t.indexOf("pronom") === 0 ? "pro" : (t.indexOf("verbe") === 0 ? "verbe" : "autre")); }
  function tagClasses(tag){ return "tg-" + tagFamily(tag) + (String(tag || "").toLowerCase().trim() === "verbe pronominal" ? " pronominal" : ""); }
  function annSentenceText(s2){
    if(s2.es) return s2.es;
    var t = s2.tokens.map(function(x){ return x.w; }).join(" ");
    return t.charAt(0).toUpperCase() + t.slice(1) + (/[.!?]$/.test(t) ? "" : ".");
  }
  var annState = null;
  function screenAnnotated(){
    var A = ANNOTATED;
    if(!annState || annState.src !== A) annState = { src:A, open:{}, tr:{}, answers:{} };
    backBtn.style.visibility = "visible";
    postmark.innerHTML = "TEXTE<br>LÉGENDÉ";
    nextBtn.textContent = (IMG && IMG.scene) ? "Décris l'image" : "Passer au contrôle";
    hint.textContent = "Touche un mot pour voir ce que c'est, 🔊 pour écouter la phrase.";
    var fams = {};
    A.sentences.forEach(function(s2){ s2.tokens.forEach(function(t){ fams[tagFamily(t.tag)] = true; }); });
    var legend = '<div class="ann-legend" aria-label="Légende des couleurs">' + TAG_LEGEND.filter(function(l){ return fams[l[0]]; }).map(function(l){
      return '<span class="ann-chip tg-'+l[0]+'">'+l[1]+'</span>';
    }).join("") + (A.sentences.some(function(s2){ return s2.tokens.some(function(t){ return String(t.tag).toLowerCase() === "verbe pronominal"; }); }) ? '<span class="ann-chip tg-verbe pronominal">Verbe pronominal</span>' : "") + '</div>';
    screen.innerHTML =
      '<div class="eyebrow">'+lessonLabel()+' · Lecture · Texte légendé</div>' +
      '<h2 class="screen-title">📝 '+drillEsc(A.title)+'</h2>' +
      (A.intro ? '<p class="lede">'+tvHtml(A.intro)+'</p>' : "") +
      legend +
      A.sentences.map(function(s2, si){
        return '<div class="ann-sent" data-si="'+si+'">' +
          '<div class="ann-row"><button type="button" class="ann-say" data-say="'+escAttr(annSentenceText(s2))+'" aria-label="Écouter la phrase">🔊</button>' +
          '<div class="ann-words">' + s2.tokens.map(function(t, ti){
            return '<button type="button" class="ann-w '+tagClasses(t.tag)+'" data-si="'+si+'" data-ti="'+ti+'" aria-expanded="false">'+drillEsc(t.w)+'</button>';
          }).join("") + '</div></div>' +
          '<div class="ann-slot" id="annSlot'+si+'"></div>' +
          (s2.fr ? '<button type="button" class="ann-trbtn" data-tr="'+si+'" aria-expanded="false">Voir la traduction</button><div class="ann-tr" id="annTr'+si+'" hidden>'+drillEsc(s2.fr)+'</div>' : "") +
        '</div>';
      }).join("") +
      (A.questions.length ? '<div class="sub-eyebrow">✏️ As-tu bien compris ? (non noté)</div><div id="annQs" class="ann-qs"></div>' : "");
    function panelHtml(t){
      return '<div class="ann-panel '+tagClasses(t.tag)+'" role="region" aria-label="'+escAttr(t.w)+'">' +
        '<div class="ann-panel-head"><span class="ann-panel-w">'+drillEsc(t.w)+'</span><span class="ann-chip '+tagClasses(t.tag)+'">'+drillEsc(t.tag)+'</span>' +
        '<button type="button" class="drill-say" data-say="'+escAttr(t.w)+'" aria-label="Écouter le mot">🔊</button></div>' +
        (t.info ? '<div class="ann-panel-info">'+drillEsc(t.info)+'</div>' : "") +
        (t.fr ? '<div class="ann-panel-fr">= '+drillEsc(t.fr)+'</div>' : "") +
        (t.tip ? '<div class="ann-panel-tip">💡 '+tvHtml(t.tip)+'</div>' : "") +
      '</div>';
    }
    function showPanel(si){
      var slot = document.getElementById("annSlot" + si), ti = annState.open[si];
      Array.prototype.forEach.call(screen.querySelectorAll('.ann-w[data-si="'+si+'"]'), function(b){
        var on = ti != null && +b.getAttribute("data-ti") === ti;
        b.classList.toggle("active", on); b.setAttribute("aria-expanded", on ? "true" : "false");
      });
      slot.innerHTML = ti == null ? "" : panelHtml(A.sentences[si].tokens[ti]);
    }
    Array.prototype.forEach.call(screen.querySelectorAll(".ann-w"), function(b){
      b.addEventListener("click", function(){
        var si = +b.getAttribute("data-si"), ti = +b.getAttribute("data-ti");
        annState.open[si] = annState.open[si] === ti ? null : ti;
        showPanel(si);
      });
    });
    Array.prototype.forEach.call(screen.querySelectorAll(".ann-trbtn"), function(b){
      var si = +b.getAttribute("data-tr");
      var apply = function(){
        var on = !!annState.tr[si];
        document.getElementById("annTr" + si).hidden = !on;
        b.textContent = on ? "Masquer la traduction" : "Voir la traduction";
        b.setAttribute("aria-expanded", on ? "true" : "false");
      };
      b.addEventListener("click", function(){ annState.tr[si] = !annState.tr[si]; apply(); });
      apply();
    });
    A.sentences.forEach(function(_, si){ if(annState.open[si] != null) showPanel(si); });
    var wrap = document.getElementById("annQs");
    if(wrap) A.questions.forEach(function(mc, qi){
      var box = document.createElement("div");
      box.className = "mini-check";
      box.innerHTML = '<div class="mini-q">'+tvHtml(mc.q)+'</div><div class="mini-opts"></div><div class="mini-fb"></div>';
      var opts = box.querySelector(".mini-opts"), fb = box.querySelector(".mini-fb");
      function reveal(chosen){
        Array.prototype.forEach.call(opts.children, function(o, oi){
          o.disabled = true;
          if(oi === mc.correct) markOption(o, "correct"); else if(oi === chosen) markOption(o, "incorrect");
        });
        fb.innerHTML = (chosen === mc.correct ? "✓ Bien vu ! " : "✕ ") + tvHtml(mc.why || "");
      }
      mc.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.type = "button"; b.className = "mini-opt"; b.textContent = opt;
        b.addEventListener("click", function(){
          if(annState.answers[qi] != null) return;
          annState.answers[qi] = oi;
          if(looksTarget(opt)) speak(opt);
          reveal(oi);
        });
        opts.appendChild(b);
      });
      wrap.appendChild(box);
      if(annState.answers[qi] != null) reveal(annState.answers[qi]);
    });
  }

  // Marks an answer button as correct/incorrect with both a color class AND an
  // explicit ✓/✕ icon, so the feedback never relies on color alone.
  function markOption(btn, cls){
    btn.classList.add(cls);
    if(!btn.querySelector(".opt-icon")){
      var icon = cls === "correct" ? "✓ " : "✕ ";
      btn.innerHTML = '<span class="opt-icon">'+icon+'</span>' + btn.textContent;
    }
  }

  function whyToggle(container, label, html){
    var btn = document.createElement("button");
    btn.className = "why-toggle";
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = "💡 " + label + " <span class=\"chev\">▾</span>";
    var panel = document.createElement("div");
    panel.className = "why-panel";
    panel.innerHTML = html;
    panel.hidden = true;
    btn.addEventListener("click", function(){
      panel.hidden = !panel.hidden;
      btn.setAttribute("aria-expanded", panel.hidden ? "false" : "true");
    });
    var wrap = document.createElement("div");
    wrap.className = "why";
    wrap.appendChild(btn);
    wrap.appendChild(panel);
    container.appendChild(wrap);
  }

  function updateRouteChip(){
    var chip = document.getElementById("routeChip");
    if(!chip) return;
    if(ES_MODE){
      chip.innerHTML = '<span class="flags">🇫🇷→'+(state.variant === "co" ? "🇨🇴" : "🇪🇸")+'</span><span>Espagnol · <b>'+(isEsBlocage(state.lesson) ? "A1/A2" : levelOfLesson(state.lesson))+'</b></span>';
      return;
    }
    if(!state.variant){
      chip.innerHTML = '<span class="flags">🇫🇷→🌍</span><span>Choisis ta version</span>';
    } else if(state.variant === "us"){
      chip.innerHTML = '<span class="flags">🇫🇷→🇺🇸</span><span>Anglais américain · <b>'+levelOfLesson(state.lesson)+'</b></span>';
    } else {
      chip.innerHTML = '<span class="flags">🇫🇷→🇬🇧</span><span>Anglais britannique · <b>'+levelOfLesson(state.lesson)+'</b></span>';
    }
  }

  function renderItinerary(){
    itinerary.innerHTML = "";
    STEPS.forEach(function(label, i){
      var leg = document.createElement("div");
      leg.className = "leg" + (i < state.step ? " done" : i === state.step ? " active" : "");
      leg.innerHTML = '<div class="dot"></div><div class="label">'+label+'</div>';
      itinerary.appendChild(leg);
    });
  }

  // ---------- Mode espagnol : accueil, bilan, écran « pas encore de leçons » ----------
  function esVariantLabel(){ return state.variant === "co" ? "espagnol de Colombie" : "espagnol d'Espagne"; }
  function esPassed(){ return (lsGet(K_PASS, {})[LANG]) || {}; }
  // Titre court d'un chapitre pour les boutons : « X2 · Les verbes pronominaux ».
  function esShortTitle(n){ return esCode(n) + (esTitle(n) ? " · " + esTitle(n) : ""); }
  function esGoApp(){
    try { sessionStorage.setItem("the_roots_last_tab", "mes-cours"); } catch(err){}
    window.location.href = "index.html";
  }
  function screenAccueilEs(){
    postmark.innerHTML = "ROOTS<br>" + esCode(state.lesson);
    backBtn.style.visibility = "hidden";
    if(!state.reviewDone && REVIEW && REVIEW.length){
      renderReviewBatch();
      return;
    }
    var blocage = isEsBlocage(state.lesson);
    var passed = esPassed();
    var chapters = LESSON_ORDER.filter(function(n){ return isPlayableLesson(n) && Math.floor(n / 100) === Math.floor(state.lesson / 100); });

  function renderReviewBatch(){
    postmark.innerHTML = "RÉVISION";

      '<div id="reviewWrap"></div>';
    var wrap = document.getElementById("reviewWrap");
    var resolved = REVIEW.map(function(){ return false; });
    function checkAllDone(){
      if(resolved.every(function(r){ return r; })){
        var doneBtn = document.createElement("button");
        doneBtn.className = "btn btn-primary";
        doneBtn.style.marginTop = "14px";
        doneBtn.textContent = "Continuer vers la leçon";
        doneBtn.addEventListener("click", function(){ state.reviewDone = true; render(); });
        wrap.appendChild(doneBtn);
      }
    }
    REVIEW.forEach(function(mc, qi){
      var box = document.createElement("div");
      box.className = "mini-check";
      box.innerHTML = '<div class="mini-q">'+mc.q+'</div><div class="mini-opts"></div><div class="mini-fb"></div>';
      var opts = box.querySelector(".mini-opts");
      var fb = box.querySelector(".mini-fb");
      var attempts = 0;
      mc.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.className = "mini-opt";
        b.textContent = opt;
        b.addEventListener("click", function(){
          if(resolved[qi] || b.disabled) return;
          if(looksTarget(opt)) speak(opt);
          attempts++;
          var ok = oi === mc.correct;
          if(ok){
            markOption(b, "correct");
            Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
            resolved[qi] = true;
            fb.textContent = "✓ Correct !";
            checkAllDone();
          } else if(attempts >= 2){
            markOption(b, "incorrect");
            markOption(opts.children[mc.correct], "correct");
            Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
            resolved[qi] = true;
            fb.textContent = "✕ " + mc.fb;
            checkAllDone();
          } else {
            markOption(b, "incorrect");
            b.disabled = true;
            fb.textContent = "Pas tout à fait — réessaie.";
          }
        });
        opts.appendChild(b);
      });
      wrap.appendChild(box);
    });
  }

  var vocabBlockIdx = 0;
  var MAX_VOCAB_PER_PAGE = 1; // une fiche (un mot) par page
  // Une "page" = un bloc thématique, ou un morceau de bloc si celui-ci dépasse MAX_VOCAB_PER_PAGE
  // mots (ex : Leçon 9 "Réservation et billets" a 8 mots -> 2 pages), pour ne jamais faire défiler
  // trop longtemps sur mobile même quand un seul thème est chargé.
  function vocabBlocks(){
    var blockNames = [];
    VOCAB.forEach(function(v){
      var key = v.block || null;
      if(blockNames.indexOf(key) === -1) blockNames.push(key);
    });
    var pages = [];
    blockNames.forEach(function(bn){
      var items = VOCAB.filter(function(v){ return (v.block || null) === bn; });
      var partTotal = Math.ceil(items.length / MAX_VOCAB_PER_PAGE) || 1;
      for(var i = 0; i < items.length; i += MAX_VOCAB_PER_PAGE){
        pages.push({ block: bn, items: items.slice(i, i+MAX_VOCAB_PER_PAGE), partIdx: Math.floor(i/MAX_VOCAB_PER_PAGE), partTotal: partTotal });
      }
    });
    return pages.length ? pages : [{ block:null, items:VOCAB, partIdx:0, partTotal:1 }];
  }

  // ---------- Dictionnaire cumulatif (pour la traduction au clic dans les textes de lecture) ----------
  // Fusionne tout le vocabulaire (VOCAB_L1..L12) et tous les glossaires (GLOSS_L1..L12) déjà écrits
  // dans l'appli, pour que n'importe quel mot déjà enseigné (dans cette leçon ou une leçon antérieure)
  // reste traduisible au clic dans n'importe quel texte de lecture, sans dépendre d'une liste
  // "mots à connaître" ressaisie à la main à chaque leçon.
  var GLOSS_DICT = null;
  function buildGlossDict(){
    if(GLOSS_DICT) return GLOSS_DICT;
    var dict = {};
    function addEntry(enRaw, frRaw){
      if(!enRaw || !frRaw) return;
      var enClean = enRaw.replace(/\s*\([^)]*\)/g, "").trim();
      var frClean = frRaw.replace(/\s*\([^)]*\)/g, "").trim();
      var ens = enClean.split("/").map(function(x){ return x.trim(); });
      var frs = frClean.split("/").map(function(x){ return x.trim(); });
      ens.forEach(function(e, i){
        var val = frs[i] || frs[0];
        var key = e.toLowerCase();
        if(key && !dict[key]) dict[key] = val;
        var bare = key.replace(/^to\s+/, "");
        if(bare !== key && !dict[bare]) dict[bare] = val;
      });
    }
    var vocabArrays = [VOCAB_L1,VOCAB_L2,VOCAB_L3,VOCAB_L4,VOCAB_L5,VOCAB_L6,VOCAB_L7,VOCAB_L8,VOCAB_L9,VOCAB_L10,VOCAB_L11,VOCAB_L12,
      VOCAB_A2_0,VOCAB_A2_1,VOCAB_A2_2,VOCAB_A2_3,VOCAB_A2_4,VOCAB_A2_5,VOCAB_A2_6,VOCAB_A2_7,VOCAB_A2_8,VOCAB_A2_9,VOCAB_A2_10,VOCAB_A2_11,
      VOCAB_B1_1,VOCAB_B1_2,VOCAB_B1_3];
    var glossArrays = [GLOSS_L1,GLOSS_L2,GLOSS_L3,GLOSS_L4,GLOSS_L5,GLOSS_L6,GLOSS_L7,GLOSS_L8,GLOSS_L9,GLOSS_L10,GLOSS_L11,GLOSS_L12,GLOSS_COMMON,
      GLOSS_A2_0,GLOSS_A2_1,GLOSS_A2_2,GLOSS_A2_3,GLOSS_A2_4,GLOSS_A2_5,GLOSS_A2_6,GLOSS_A2_7,GLOSS_A2_8,GLOSS_A2_9,GLOSS_A2_10,GLOSS_A2_11,
      GLOSS_B1_1,GLOSS_B1_2,GLOSS_B1_3];
    // Mode espagnol : uniquement le vocabulaire et les glossaires des leçons espagnoles (ci-dessous).
    if(ES_MODE){ vocabArrays = []; glossArrays = []; }
    // B1.0, B1.4+ / B2 (fichiers de données) : ajoutés à la suite, dans l'ordre pédagogique (lessonRank).
    Object.keys(LESSONS_EXT).map(Number).sort(function(a, b){ return lessonRank(a) - lessonRank(b); }).forEach(function(n){
      if(!isPlayableLesson(n)) return;
      vocabArrays.push(LESSONS_EXT[n].VOCAB); glossArrays.push(LESSONS_EXT[n].GLOSS);
    });
    vocabArrays.forEach(function(arr){ (arr||[]).forEach(function(v){ addEntry(v.en, v.fr); }); });
    glossArrays.forEach(function(arr){ (arr||[]).forEach(function(g){ addEntry(g.en, g.fr); }); });
    GLOSS_DICT = dict;
    return dict;
  }
  function lookupPhrase(dict, phrase){
    if(dict[phrase]) return dict[phrase];
    if(phrase.slice(-3) === "ing" && dict[phrase.slice(0,-3)]) return dict[phrase.slice(0,-3)];
    if(phrase.slice(-3) === "ing" && dict[phrase.slice(0,-3)+"e"]) return dict[phrase.slice(0,-3)+"e"];
    if(phrase.slice(-2) === "es" && dict[phrase.slice(0,-2)]) return dict[phrase.slice(0,-2)];
    if(phrase.slice(-1) === "s" && dict[phrase.slice(0,-1)]) return dict[phrase.slice(0,-1)];
    return null;
  }
  // Découpe une phrase et enveloppe chaque mot/expression reconnu(e) du dictionnaire cumulatif
  // dans un <span> cliquable qui affiche sa traduction (jusqu'à 3 mots, le plus long d'abord,
  // pour ne jamais traduire un fragment d'une expression composée comme "meet up").
  function glossifySentence(s){
    var dict = buildGlossDict();
    // (Espagnol : les lettres accentuées á é í ó ú ñ ü font partie des mots.)
    var tokens = (ES_MODE ? s.match(/[A-Za-zÀ-ÿ'-]+|[^A-Za-zÀ-ÿ'-]+/g) : s.match(/[A-Za-z'-]+|[^A-Za-z'-]+/g)) || [s];
    var wordIdxs = [];
    tokens.forEach(function(t, i){ if(ES_MODE ? /[A-Za-zÀ-ÿ]/.test(t) : /[A-Za-z]/.test(t)) wordIdxs.push(i); });
    var used = {};
    var htmlTokens = tokens.map(function(){ return null; });
    for(var wi = 0; wi < wordIdxs.length; wi++){
      if(used[wordIdxs[wi]]) continue;
      for(var span = 3; span >= 1; span--){
        if(wi + span > wordIdxs.length) continue;
        var idxs = wordIdxs.slice(wi, wi+span);
        if(idxs.some(function(ix){ return used[ix]; })) continue;
        var phrase = idxs.map(function(ix){ return tokens[ix]; }).join(" ").toLowerCase();
        var fr = lookupPhrase(dict, phrase);
        if(fr){
          var startTok = idxs[0], endTok = idxs[idxs.length-1];
          var display = tokens.slice(startTok, endTok+1).join("");
          var frEsc = fr.replace(/"/g, "&quot;");
          htmlTokens[startTok] = '<span class="gloss-word" data-fr="'+frEsc+'">'+display+'</span>';
          for(var k = startTok+1; k <= endTok; k++){ htmlTokens[k] = ""; used[k] = true; }
          used[idxs[0]] = true;
          break;
        }
      }
    }
    return tokens.map(function(t, i){ return htmlTokens[i] !== null ? htmlTokens[i] : t; }).join("");
  }

  // Données : window.LESSONS_TRANSVERSAL[n] = { interference:[{wrong,right,why}], survival:[{en,fr,when}] }
  // (js/data/transversal.js, format .staging/TRANSVERSAL-FORMAT.md). Seule la balise <b> est

  // Paliers qui peuvent recevoir un encart : A1.1-A1.12 (0..11), A2.0-A2.11 (13..24) et les paliers

  function hasTransversalSlot(n){ return (n >= 0 && n <= 11) || (n >= 13 && n <= 24) || isBLesson(n); }
  function validTransversal(T){
    if(!T || typeof T !== "object") return null;

    var surv = (T.survival || []).filter(function(x){ return x && x.en; });

      try{
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = function(){
          if(chunks.length){
            var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
            var url = URL.createObjectURL(blob);
            replayBtn.disabled = false;
            replayBtn.onclick = function(){ new Audio(url).play(); };
          }
        };
        recorder.start();
      }catch(e){ recorder = null; }
    }

    function finish(ok){
      statusEl.textContent = ok === null ? "—" : (ok ? "✓" : "✗");
      statusEl.className = "pron-status" + (ok === true ? " ok" : ok === false ? " bad" : "");
      micBtn.disabled = false;
      micBtn.textContent = prevLabel;
      if(recorder && recorder.state !== "inactive") recorder.stop();
    }

    try{
      var rec = new SpeechRec();
      rec.lang = targetLang();
      rec.maxAlternatives = 3;
      var finished = false;
      rec.onresult = function(e){
        finished = true;
        var said = (e.results[0][0].transcript || "").toLowerCase().replace(/[.,!?]/g,"").trim();
        var exp = expected.toLowerCase().replace(/[.,!?]/g,"").trim();
        // Espagnol : on ignore aussi ¿ ¡ et les accents (le micro ne les rend pas toujours).
        if(ES_MODE){ said = drillFold(said.replace(/[¿¡;:]/g, "")).replace(/\s+/g, " "); exp = drillFold(exp.replace(/[¿¡;:]/g, "")).replace(/\s+/g, " "); }
        finish(said.indexOf(exp) !== -1 || exp.indexOf(said) !== -1);
      };
      rec.onerror = function(){ finished = true; finish(null); };
      rec.onend = function(){ if(!finished) finish(null); };
      rec.start();
    }catch(err){
      finish(null);
    }

    setTimeout(function(){ if(recorder && recorder.state !== "inactive") recorder.stop(); }, 4000);
  }

  function renderMiniCheckList(container, items, onAllDone){
    var resolved = items.map(function(){ return false; });
    function maybeAdvance(){
      if(resolved.every(function(r){ return r; })) onAllDone();
    }
    items.forEach(function(mc, qi){
      var box = document.createElement("div");
      box.className = "mini-check";
      box.innerHTML = '<div class="mini-q">'+mc.q+'</div><div class="mini-opts"></div><div class="mini-fb"></div>';
      var opts = box.querySelector(".mini-opts");
      var fb = box.querySelector(".mini-fb");
      var attempts = 0;
      mc.opts.forEach(function(opt, oi){
        var b = document.createElement("button");
        b.className = "mini-opt";
        b.textContent = opt;
        b.addEventListener("click", function(){
          if(resolved[qi] || b.disabled) return;
          if(looksTarget(opt)) speak(opt);
          attempts++;
          var ok = oi === mc.correct;
          if(ok){
            markOption(b, "correct");
            Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
            resolved[qi] = true;
            fb.textContent = "✓ Correct !";
            maybeAdvance();
          } else if(attempts >= 2){
            markOption(b, "incorrect");
            markOption(opts.children[mc.correct], "correct");
            Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
            resolved[qi] = true;
            fb.textContent = "✕ " + mc.fb;
            maybeAdvance();
          } else {
            markOption(b, "incorrect");
            b.disabled = true;
            fb.textContent = "Pas tout à fait — réessaie.";
          }
        });

      });

  function renderMemGrid(){
    var grid = document.getElementById("memgrid");
    grid.innerHTML = "";
    memState.cards.forEach(function(c, idx){
      var isOpen = memState.open.indexOf(idx) !== -1 || memState.matched.indexOf(idx) !== -1;
      var isMatched = memState.matched.indexOf(idx) !== -1;
      var d = document.createElement("button");
      d.className = "mcard" + (isOpen ? " flipped" : "") + (isMatched ? " matched" : "");
      d.innerHTML = '<span class="face">'+c.face+'</span><span class="back">?</span>';
      d.setAttribute("aria-label", isOpen ? c.face : "Carte face cachée");
      if(!isMatched) d.addEventListener("click", function(){ flip(idx); });
      grid.appendChild(d);
    });
    document.getElementById("movesN").textContent = memState.moves;
    document.getElementById("matchN").textContent = memState.matched.length/2;
  }

  function flip(idx){
    if(memState.open.indexOf(idx) !== -1 || memState.matched.indexOf(idx) !== -1) return;
    if(memState.open.length === 2) return;
    memState.open.push(idx);
    renderMemGrid();
    if(memState.open.length === 2){
      memState.moves++;
      var a = memState.cards[memState.open[0]], b = memState.cards[memState.open[1]];
      if(a.pairId === b.pairId){
        memState.matched.push(memState.open[0], memState.open[1]);
        if(a.kind === "en") speak(a.face); else if(b.kind === "en") speak(b.face);
        memState.open = [];
        renderMemGrid();
        nextBtn.disabled = memState.matched.length < memState.cards.length/2;
      } else {
        var toClose = memState.open.slice();
        setTimeout(function(){
          memState.open = memState.open.filter(function(i){ return toClose.indexOf(i) === -1; });
          renderMemGrid();
        }, 700);
      }
    }
  }

  // =====================================================================
  // EXAMEN DE FIN DE PALIER (phase d'immersion, à partir du B1) — 25/09
  // Quand js/data/exams.js définit un examen pour la leçon en cours (window.LESSON_EXAMS[n],
  // format documenté en tête de ce fichier), l'étape « Contrôle » (step 5) devient cet examen :
  // sections I, II… une par écran, consignes en anglais + traduction française (.exam-fr).
  // Types : "fill" (trous tapés, corrigés ici), "mcq" (QCM, lecture/écoute), "ai-text" et

  //   comme renfort garde le QCM classique (rapide), tout comme les missions et la pratique.

  //   93+ validé ; résultat enregistré par saveControlResult(code du palier, ex. "B1.1").
  // - Avancement gardé dans localStorage (EXAM_KEY) : quitter / revenir sans rien perdre.

  // =====================================================================
  var EXAM_KEY = "the_roots_exam_v1";
  var examUi = null; // état d'écran (brouillon chargé, correction IA en cours, micro…)

  function isValidExam(X){ return !!(X && X.code && X.sections && X.sections.length); }
  // Nom affiché : « Grand Contrôle B1 » (label) ou « Examen B1.3 ».
  function examName(){ return EXAM.label ? EXAM.label : "Examen " + EXAM.code; }
  function examVariant(){ return EXAM.variant || "main"; }

  // l'examen entièrement terminé et rendu (demande d'Ashley, 30/09) — pendant l'examen, une section
  // validée est simplement « enregistrée ».
  function examShowCorr(d){ return !!(d && d.done); }
  var EXAM_SAVED_HTML = '<div class="exam-ok" style="color:var(--ink-soft,#555)">✓ Section enregistrée. Le corrigé détaillé et ta note s\'affichent à la fin de l\'examen.</div>';
  function examPassageHtml(S){
    return S.passage ? '<div class="q-passage exam-passage">' + String(S.passage).split(/\n\s*\n/).map(function(p){ return '<p>'+examEsc(p)+'</p>'; }).join("") + '</div>' : "";
  }
  function examActive(){ return !!(EXAM && state.returnTo == null && !PRACTICE); }
  function examEsc(s){ return escAttr(s).replace(/>/g, "&gt;"); }
  function examFmt(n){ var r = Math.round(n * 10) / 10; return String(r).replace(".", ","); }
  function examWords(t){ var m = String(t || "").trim().match(/[A-Za-zÀ-ÿ0-9'’-]+/g); return m ? m.length : 0; }

  // >>> EXAM-NORMALIZE (bloc extrait tel quel par le test unitaire Node .staging/test-exam-normalize.js)
  // Comparaison souple d'une réponse tapée dans un trou : majuscules, espaces multiples,
  // apostrophes droites/typographiques, ponctuation, contractions (I've = I have, 'm = am,
  // 'll = will, 're = are, n't = not, he's = he is), orthographe UK/US (travelled = traveled).
  var EXAM_UKUS_RE = /\b(travel|cancel|label|model|level|fuel|signal|dial|marvel|quarrel|total|counsel|jewel|channel|tunnel|equal|panel|rival|shovel)l(ed|ing|er|ers)\b/g;
  function examNormalize(s){
    s = String(s == null ? "" : s).toLowerCase();
    s = s.replace(/[‘’‚‛ʼ`´]/g, "'");
    s = s.replace(/[“”„"«»]/g, " ");
    s = s.replace(/[.,!?;:…()\[\]]+/g, " ");
    s = s.replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "can not").replace(/\bshan't\b/g, "shall not").replace(/\bcannot\b/g, "can not");
    s = s.replace(/n't\b/g, " not");
    s = s.replace(/'ve\b/g, " have").replace(/'m\b/g, " am").replace(/'ll\b/g, " will").replace(/'re\b/g, " are");
    s = s.replace(/\b(he|she|it|that|there|what|who|where|here|how)'s\b/g, "$1 is");
    s = s.replace(/(^|\s)'s\b/g, "$1is");
    s = s.replace(EXAM_UKUS_RE, "$1$2");
    return s.replace(/\s+/g, " ").trim();
  }
  // true si "given" correspond à l'une des réponses acceptées. before / after = texte de la
  // phrase juste avant / après le trou : on accepte aussi que l'apprenant ait retapé le sujet
  // (« I have lived » pour « I ___ ») ou le mot qui suit (« … waking up » pour « ___ (wake) up »).
  function examBlankOk(given, accepted, before, after){
    var g = examNormalize(given);
    if(!g) return false;
    var cands = [g];
    var prev = examNormalize(before || "").split(" ").pop();
    var next = examNormalize(String(after || "").replace(/^\s*\([^)]*\)/, "")).split(" ")[0];
    if(prev && g.indexOf(prev + " ") === 0) cands.push(g.slice(prev.length + 1));
    cands.slice().forEach(function(c){
      if(next && c.length > next.length && c.slice(-(next.length + 1)) === " " + next) cands.push(c.slice(0, -(next.length + 1)));
    });
    for(var i = 0; i < (accepted || []).length; i++){
      if(cands.indexOf(examNormalize(accepted[i])) >= 0) return true;
    }
    return false;
  }

  // ----- Type "fill" -----
  function examFillPts(S, k){
    var it = S.items[k];
    return it.points != null ? it.points : S.points / S.items.length;
  }
  function examFillHtml(S, d, res){
    var ans = d.answers[S.id] || [];
    var bank = (S.bank && S.bank.length)
      ? '<div class="exam-bank" role="group" aria-label="Word bank">' + S.bank.map(function(w){ return '<button type="button" class="exam-chip" data-word="'+escAttr(w)+'"'+(res ? " disabled" : "")+'>'+examEsc(w)+'</button>'; }).join("") + '</div>'
      : "";
    return bank + S.items.map(function(it, k){
      var parts = String(it.text).split("___"), a = ans[k] || [], show = res && examShowCorr(d), det = show && res.detail ? res.detail[k] || [] : [];
      var html = "";
      for(var p = 0; p < parts.length; p++){
        html += examEsc(parts[p]);
        if(p < parts.length - 1){
          var cls = show ? (det[p] ? " ok" : " ko") : "";
          html += '<input type="text" class="exam-blank'+cls+'" data-k="'+k+'" data-b="'+p+'" value="'+escAttr(a[p] || "")+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Blank '+(p+1)+'"'+(res ? " disabled" : "")+'>';
        }
      }
      var corr = "";
      if(show){
        var allOk = det.length && det.every(function(x){ return x; });
        corr = allOk
          ? '<div class="exam-ok">✓ Correct</div>'
          : '<div class="why-inline"><span class="icon">💡</span><div><b>'+it.blanks.map(function(b){ return examEsc(b[0]); }).join(" / ")+'</b>'+(it.why ? '<br>'+examEsc(it.why) : "")+'</div></div>';
      }

        '<div class="exam-item"><span class="exam-n">'+(k+1)+'.</span> '+html+'</div>' + corr;
    }).join("") + (res && !examShowCorr(d) ? EXAM_SAVED_HTML : "");
  }
  function wireExamFill(S, d, res){
    if(res) return;
    var lastFocus = null;
    Array.prototype.forEach.call(screen.querySelectorAll(".exam-blank"), function(inp){
      inp.addEventListener("focus", function(){ lastFocus = inp; });
      inp.addEventListener("input", function(){
        var k = +inp.getAttribute("data-k"), b = +inp.getAttribute("data-b");
        var ans = d.answers[S.id] = d.answers[S.id] || [];
        ans[k] = ans[k] || []; ans[k][b] = inp.value;
        examUi.confirm = false; examUi.confirmMsg = "";
        examSaveDraft();
      });
    });
    Array.prototype.forEach.call(screen.querySelectorAll(".exam-chip"), function(c){
      // Pastille : remplit le dernier trou touché (ou le premier trou vide).
      c.addEventListener("mousedown", function(e){ e.preventDefault(); });
      c.addEventListener("click", function(){
        var target = lastFocus;
        if(!target || target.value.trim()){
          var empty = Array.prototype.filter.call(screen.querySelectorAll(".exam-blank"), function(x){ return !x.value.trim(); })[0];
          target = (!lastFocus || lastFocus.value.trim()) ? (empty || lastFocus) : lastFocus;
        }
        if(!target) return;
        target.value = c.getAttribute("data-word");
        target.dispatchEvent(new Event("input"));
        target.focus();
      });
    });
  }
  function examGradeFill(S, d){
    var ans = d.answers[S.id] || [], score = 0, detail = [];
    S.items.forEach(function(it, k){
      var parts = String(it.text).split("___"), per = examFillPts(S, k) / it.blanks.length, row = [];
      it.blanks.forEach(function(acc, b){
        var ok = examBlankOk((ans[k] || [])[b], acc, parts[b], parts[b + 1]);
        row.push(ok);
        if(ok) score += per;
        recordSkill(S.skill || "gr", ok);
        if(!ok) recordError(state.lesson);
      });
      detail.push(row);
    });
    return { score:Math.round(score * 100) / 100, max:S.points, detail:detail };
  }
  function examFillEmpty(S, d){
    var ans = d.answers[S.id] || [], n = 0;
    S.items.forEach(function(it, k){ it.blanks.forEach(function(acc, b){ if(!String((ans[k] || [])[b] || "").trim()) n++; }); });
    return n;
  }

  // ----- Type "mcq" -----
  function examMcqHtml(S, d, res){
    var ans = d.answers[S.id] || [], show = res && examShowCorr(d);
    var passage = examPassageHtml(S);
    return passage + S.items.map(function(it, k){
      var audio = "";
      if(it.audio){
        var script = typeof it.audio === "string" ? examEsc(it.audio)
          : it.audio.map(function(l){ return '<b>'+examEsc(l.who)+':</b> '+examEsc(l.text); }).join("<br>");

          '<span class="q-audio-hint">Recording '+(k+1)+' — listen (again)<span class="exam-fr" style="margin:0">Enregistrement '+(k+1)+' — écouter (réécouter)</span></span></div>' +
          (show ? '<details class="gc-recap-toggle exam-script"><summary>Voir le texte de l\'enregistrement</summary><div class="q-passage">'+script+'</div></details>' : "");
      }
      var chosen = ans[k];
      var opts = it.opts.map(function(o, j){
        var cls = "opt exam-opt";
        var icon = "";
        if(show){
          if(j === it.correct){ cls += " correct"; icon = '<span class="opt-icon">✓ </span>'; }
          else if(j === chosen){ cls += " incorrect"; icon = '<span class="opt-icon">✕ </span>'; }
        } else if(j === chosen) cls += " selected";
        return '<button type="button" class="'+cls+'" data-k="'+k+'" data-o="'+j+'" aria-pressed="'+(j === chosen ? "true" : "false")+'"'+(res ? " disabled" : "")+'>'+icon+examEsc(o)+'</button>';
      }).join("");
      var why = (show && chosen !== it.correct && it.why) ? '<div class="why-inline"><span class="icon">💡</span><div>'+(chosen == null ? "<b>Pas de réponse.</b> " : "")+examEsc(it.why)+'</div></div>' : "";
      return '<div class="exam-item exam-mcq">' + audio +
        '<div class="exam-q"><b>'+(k+1)+'. '+examEsc(it.q)+'</b>'+(it.qFr ? '<div class="exam-fr">'+examEsc(it.qFr)+'</div>' : "")+'</div>' +
        '<div class="options" style="margin-top:8px">'+opts+'</div>' + why + '</div>';
    }).join("") + (res && !examShowCorr(d) ? EXAM_SAVED_HTML : "");
  }
  function examPlay(audio){
    if(!audio) return;
    if(typeof audio === "string"){ speak(audio); return; }
    try {
      if(!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var voiceA = null;
      audio.forEach(function(line, i){
        var u = makeUtterance(line.text);
        if(i === 0) voiceA = u.voice || null;
        if(line.who !== audio[0].who){
          // 2e personne : une autre voix de la même langue si le téléphone en a une, et une voix plus aiguë.
          var lang = (u.lang || "").slice(0, 2);
          var other = cachedVoices.filter(function(v){ return (v.lang || "").slice(0, 2) === lang && v !== voiceA; })[0];
          if(other && (other.lang || "").replace("_", "-").indexOf(state.variant === "us" ? "en-US" : "en-GB") === 0){ u.voice = other; u.lang = other.lang; }
          u.pitch = 1.25;
        } else { u.pitch = 0.95; }
        window.speechSynthesis.speak(u);
      });
    } catch(e){}
  }
  function wireExamMcq(S, d, res){
    Array.prototype.forEach.call(screen.querySelectorAll(".exam-play"), function(b){
      b.addEventListener("click", function(){ examPlay(S.items[+b.getAttribute("data-k")].audio); });
    });
    if(res) return;
    Array.prototype.forEach.call(screen.querySelectorAll(".exam-opt"), function(b){
      b.addEventListener("click", function(){
        var k = +b.getAttribute("data-k"), j = +b.getAttribute("data-o");
        var ans = d.answers[S.id] = d.answers[S.id] || [];
        ans[k] = j;
        examUi.confirm = false; examUi.confirmMsg = "";
        examSaveDraft();
        Array.prototype.forEach.call(screen.querySelectorAll('.exam-opt[data-k="'+k+'"]'), function(o){
          var on = o === b;
          o.classList.toggle("selected", on);
          o.setAttribute("aria-pressed", on ? "true" : "false");
        });
      });
    });
  }
  function examGradeMcq(S, d){
    var ans = d.answers[S.id] || [], score = 0, detail = [];
    S.items.forEach(function(it, k){
      var ok = ans[k] === it.correct, pts = it.points != null ? it.points : S.points / S.items.length;
      if(ok) score += pts;
      detail.push(ok);
      recordSkill(S.skill || "ce", ok);
      if(!ok) recordError(state.lesson);
    });
    return { score:Math.round(score * 100) / 100, max:S.points, detail:detail };
  }
  function examMcqEmpty(S, d){
    var ans = d.answers[S.id] || [];
    return S.items.filter(function(it, k){ return ans[k] == null; }).length;
  }

  // ----- Types "ai-text" / "ai-oral" -----
  function examAiAnswer(S, d){
    var a = d.answers[S.id];
    if(S.type === "ai-oral") return a && typeof a === "object" ? a : { text:"", confs:[], typed:false, micUsed:false };
    return typeof a === "string" ? a : "";
  }
  function examAiText(S, d){ var a = examAiAnswer(S, d); return typeof a === "string" ? a : (a.text || ""); }
  function examCountHtml(S, text){
    var n = examWords(text), lo = S.minWords, hi = S.maxWords;
    var warn = (lo && n < lo) || (hi && n > hi);
    var range = lo && hi ? " · " + lo + "–" + hi + " words" : (lo ? " · min. " + lo + " words" : "");
    return '<span class="'+(warn ? "warn" : "")+'">'+n+' word'+(n > 1 ? "s" : "")+range+'</span>';
  }
  function examAiResultHtml(r){
